<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build the Hype · Responsive QA</title><style>body{font:14px Arial,sans-serif;background:#e7e7ea;color:#222;margin:20px}button{font:inherit;padding:10px 16px;margin-right:8px;cursor:pointer}iframe{display:block;border:2px solid #555;width:390px;height:950px;max-width:100%;margin:20px 0;background:#16111f}small{display:block;max-width:800px;margin:12px 0;line-height:1.5}</style></head><body><h1>Build the Hype: responsive QA</h1><p>This development-only frame loads the actual published activity at a fixed CSS width.</p><button data-width="390">Phone · 390px</button><button data-width="768">Tablet · 768px</button><button data-width="1100">Desktop · 1100px</button><small>Uses the same local browser save as the activity. This is a layout check, not a physical-device or Safari test. The activity’s ordinary student route is one directory above tests.</small><iframe title="Activity responsive preview" src="../index.html"></iframe><script>document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('iframe').style.width=b.dataset.width+'px'}));</script></body></html>
