name: Pixel Forge Entry QA
on:
  push:
    branches: [main, fix/pixel-forge-first-visit-entry-20261109]
    paths:
      - 'spm370/labor-relations-decision-lab/**'
      - '.github/workflows/pixel-forge-entry-qa.yml'
  pull_request:
    paths:
      - 'spm370/labor-relations-decision-lab/**'
      - '.github/workflows/pixel-forge-entry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-visit-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and existing regressions
        run: |
          node --check spm370/labor-relations-decision-lab/app.js
          node --check spm370/labor-relations-decision-lab/assessment.js
          node spm370/labor-relations-decision-lab/test.cjs
          node spm370/labor-relations-decision-lab/assessment.test.cjs
          node --test spm370/labor-relations-decision-lab/backend/tests/*.test.mjs
      - name: Install pinned browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check desktop and narrow-screen entry without creating records
        run: node spm370/labor-relations-decision-lab/entry.browser.cjs
