name: Before You Sign LLC3 QA
on:
  push:
    branches: [main, spm370-llc3-six-vignettes-20261008]
    paths:
      - 'spm370/before-you-sign/**'
      - '.github/workflows/before-you-sign-qa.yml'
  pull_request:
    paths:
      - 'spm370/before-you-sign/**'
      - '.github/workflows/before-you-sign-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scored-submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check student and instructor scripts
        run: |
          node --check spm370/before-you-sign/connection-v3.js
          node --check spm370/before-you-sign/lesson.js
          node --check spm370/before-you-sign/instructor/instructor.js
          node --check spm370/before-you-sign/backend/v3-store.mjs
      - name: Verify scored submission and review flow
        run: node --test spm370/before-you-sign/backend/v3-server.test.mjs
