name: Off Script Nova Published Check
on:
  push:
    branches: [offscript-nova-final-qa-20261006]
    paths: ['.github/workflows/offscript-nova-published-check.yml']
permissions:
  contents: read
jobs:
  published-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify live pages, exact tested source, avatar, and backend availability
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const base='https://jflevine.github.io/SportManagementSim/spm370/off-script/';
          const expected=readFileSync('spm370/off-script/index.html','utf8');
          const digest=t=>createHash('sha256').update(t).digest('hex');
          let page;
          for(let attempt=0;attempt<16;attempt++){
            const r=await fetch(base+'?qa_build=2.0.1&check='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});
            if(r.ok){const text=await r.text();if(text===expected){page=text;break;}}
            await new Promise(resolve=>setTimeout(resolve,8000));
          }
          assert(page,'Published page does not yet match the tested build.');
          assert(page.includes('Build 2.0.1.'));
          assert(page.includes('Restart demo'));
          assert(page.includes('Treat the supplied agreement as valid.'));
          const checks=[];
          for(const suffix of ['', '?demo=1', '?guide=1', '?instructor=1']){
            const r=await fetch(base+suffix,{cache:'no-store',signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200);assert.equal(await r.text(),expected,'Source mismatch: '+suffix);
            checks.push({route:suffix||'student',status:200,sourceMatches:true});
          }
          const redirect=await fetch(base+'instructor/');assert.equal(redirect.status,200);assert((await redirect.text()).includes('instructor=1'));
          const image=await fetch(base+'assets/avatars/nova.webp');assert.equal(image.status,200);assert(image.headers.get('content-type').startsWith('image/'));assert((await image.arrayBuffer()).byteLength>1000);
          const health=await fetch('https://havsvkhddvdbzbsmhqbr.supabase.co/functions/v1/spm370-offscript-nova');assert.equal(health.status,200);assert.equal((await health.json()).storageReady,true);
          console.log('PUBLISHED_NOVA_VERIFIED',JSON.stringify({build:'2.0.1',sha256:digest(page),checks,avatar:'PASS',instructorRedirect:'PASS',backend:'READY',databaseWrites:0}));
          JS
