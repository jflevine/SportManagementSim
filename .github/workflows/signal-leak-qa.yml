name: Signal Leak browser QA
on:
  pull_request:
    paths: ['spm370/signal-leak/**', '.github/workflows/signal-leak-qa.yml']
  push:
    paths: ['spm370/signal-leak/**', '.github/workflows/signal-leak-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check spm370/signal-leak/app.mjs
          node --check spm370/signal-leak/browser-qa.cjs
      - name: Install pinned browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Synthetic local-only desktop and mobile journey
        run: node spm370/signal-leak/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-leak-browser-evidence
          path: signal-qa-results/
