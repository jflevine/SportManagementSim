<script id="gate-rush-model">
(function(global){
  'use strict';
  const WAVES=[{time:'08:30',end:'08:35',routine:4,help:0,note:'The first teams are ready to confirm their rosters.'},{time:'08:35',end:'08:40',routine:0,help:3,note:'Three captains need a roster, payment, or non-digital check-in question resolved.'},{time:'08:40',end:'08:45',routine:6,help:0,note:'A larger group of routine check-ins arrives together.'},{time:'08:45',end:'08:50',routine:2,help:3,note:'Both service routes now have new arrivals.'},{time:'08:50',end:'08:55',routine:6,help:0,note:'The final six captains arrive before the first games.'},{time:'08:55',end:'09:00',routine:0,help:0,note:'No new arrivals. Clear the remaining queue before the first games.'}];
  const TOTAL=24;
  function initial(){return {step:0,queues:{routine:[],help:[]},completed:[],history:[],waitingMinutes:0,arrived:0};}
  function advance(model,routineStaff){
    if(!Number.isInteger(routineStaff)||![1,2].includes(routineStaff))throw new Error('One volunteer must remain on each route.');
    if(model.step>=WAVES.length)throw new Error('This run is complete.');
    const m=JSON.parse(JSON.stringify(model)),wave=WAVES[m.step],helpStaff=3-routineStaff,before={routine:m.queues.routine.length,help:m.queues.help.length},newTeams=[];
    for(const route of ['routine','help'])for(let i=0;i<wave[route];i++){const team={id:++m.arrived,route,arrivalStep:m.step,servedStep:null};m.queues[route].push(team);newTeams.push(team.id);}
    const capacities={routine:routineStaff*2,help:helpStaff},served=[];
    for(const route of ['routine','help']){const count=Math.min(m.queues[route].length,capacities[route]);for(let i=0;i<count;i++){const team=m.queues[route].shift();team.servedStep=m.step;team.wait=(m.step-team.arrivalStep)*5;m.completed.push(team);served.push(team);}}
    const addedWait=(m.queues.routine.length+m.queues.help.length)*5;m.waitingMinutes+=addedWait;
    m.history.push({step:m.step,time:wave.time,end:wave.end,routineStaff,helpStaff,capacities,before,arrivals:{routine:wave.routine,help:wave.help},served,remaining:{routine:m.queues.routine.length,help:m.queues.help.length},addedWait,totalWait:m.waitingMinutes,newTeams});m.step++;
    return m;
  }
  function simulate(allocations){return allocations.reduce(advance,initial());}
  function metrics(m){
    const routes={};for(const route of ['routine','help']){const finished=m.completed.filter(t=>t.route===route),pending=m.queues[route];routes[route]={served:finished.length,pending:pending.length,finishedWait:finished.reduce((a,t)=>a+t.wait,0),pendingWait:pending.reduce((a,t)=>a+(m.step-t.arrivalStep)*5,0),longest:Math.max(0,...finished.map(t=>t.wait),...pending.map(t=>(m.step-t.arrivalStep)*5))};}
    return {served:m.completed.length,pending:m.queues.routine.length+m.queues.help.length,waitingMinutes:m.waitingMinutes,notArrived:TOTAL-m.arrived,routes};
  }
  global.GateRushModel=Object.freeze({WAVES,TOTAL,initial,advance,simulate,metrics});
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>
(function(){
'use strict';
const M=window.GateRushModel,KEY='mgt340.gate-rush.v1',SCHEMA=1,$=id=>document.getElementById(id),guide=new URLSearchParams(location.search).get('guide')==='1';
const fresh=()=>({version:SCHEMA,started:false,stage:'intro',run:0,runs:[[],[]],selected:2,alias:'',change:'',evidence:'',brief:'',paused:false,reduced:false});
let state=fresh(),storageAvailable=true,resumed=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function valid(x){
 if(!(x&&x.version===SCHEMA&&['intro','live','between','redesign','final'].includes(x.stage)&&[0,1].includes(x.run)&&Array.isArray(x.runs)&&x.runs.length===2&&x.runs.every(a=>Array.isArray(a)&&a.length<=6&&a.every(v=>v===1||v===2))&&[1,2].includes(x.selected)&&['alias','change','evidence','brief'].every(k=>typeof x[k]==='string'&&x[k].length<2000)&&typeof x.started==='boolean'&&typeof x.paused==='boolean'&&typeof x.reduced==='boolean'))return false;
 const a=x.runs[0].length,b=x.runs[1].length;
 if(!x.started)return x.stage==='intro'&&a===0&&b===0;
 if(x.stage==='live')return x.run===0?a<6&&b===0:a===6&&b<6;
 if(x.stage==='between'||x.stage==='redesign')return x.run===0&&a===6&&b===0;
 return x.stage==='final'&&x.run===1&&a===6&&b===6;
}
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(valid(parsed)){state={...fresh(),...parsed};resumed=state.started;}else localStorage.removeItem(KEY);}}catch(e){storageAvailable=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageAvailable=true;}catch(e){storageAvailable=false;}updateSaveStatus();}
function updateSaveStatus(){const n=$('save-state');if(n)n.textContent=storageAvailable?'Saved on this device only. Nothing is sent to an instructor.':'Browser saving is unavailable. Keep this tab open and download your result before leaving.';}
function announce(t){$('announcer').textContent=t;}
function focusMain(){requestAnimationFrame(()=>$('main').focus({preventScroll:true}));window.scrollTo({top:0,behavior:'instant'});}
function footer(){return `<footer class="footer"><span>MGT 340 · La Salle University · Classroom simulation</span><span>No names, email addresses, or login needed</span></footer>`;}
function storageNote(){return `<p class="saved" id="save-state"></p>`;}
function reduceToggle(){return `<label class="motion-toggle"><input id="reduce-motion" type="checkbox" ${state.reduced?'checked':''}> Reduce movement</label>`;}
function bindCommon(){document.body.classList.toggle('no-motion',state.reduced);const r=$('reduce-motion');if(r)r.addEventListener('change',()=>{state.reduced=r.checked;document.body.classList.toggle('no-motion',state.reduced);save();});updateSaveStatus();}
function render(){
  if(guide){renderGuide();return;}
  document.title='Gate Rush · Event Management Field Lab';
  $('restart').hidden=!state.started;
  if(!state.started||state.stage==='intro')renderIntro();
  else if(state.paused)renderPaused();
  else if(state.stage==='live')renderLive();
  else if(state.stage==='between')renderBetween();
  else if(state.stage==='redesign')renderRedesign();
  else renderFinal();
  bindCommon();

 $('main').innerHTML=`<article class="guide"><p class="eyebrow">Public instructor guide · No password required</p><h1>Gate Rush</h1><p class="lead">A 15-minute rehearsal of event registration, volunteer allocation, live operations, and evaluation. Pods of 3–4 use one device, run six windows, redesign, and replay the identical demand.</p><p><a class="btn gold" href="${esc(location.pathname)}">Open the student game</a></p><section><h2>Learning goal</h2><p>Students explain how arrival patterns, service rates, staffing, and unresolved exceptions create the check-in experience. They use the same demand to test a management change and support it with observable evidence.</p><p>The lesson applies the lecture’s <em>run of show</em>, <em>registration as a service process</em>, <em>volunteer readiness</em>, and <em>event evaluation</em>. It is an operational rehearsal rather than a repeat of the event-budget allocation exercise.</p></section><section><h2>Fifteen-minute route</h2><div class="table-scroll"><table><thead><tr><th>Time</th><th>Facilitation</th></tr></thead><tbody><tr><td>0–2 minutes</td><td>Read the three steps. Explain that one captain represents each team, both routes remain staffed, and time moves only by button.</td></tr><tr><td>2–7 minutes</td><td>First rehearsal. Rotate the staffing decision. Ask the pod to explain which queue needs the floating volunteer.</td></tr><tr><td>7–12 minutes</td><td>Name a change and replay the identical arrivals. Use the full forecast and first-run evidence.</td></tr><tr><td>12–15 minutes</td><td>Compare readiness, total queue delay, and both routes. Prepare the 20-second operations handoff.</td></tr></tbody></table></div><p class="small muted">Allow a separate whole-class debrief or exit response if available. There is no enforced countdown in the game.</p></section><section><h2>Roles and constraints</h2><ul><li><strong>Three trained registration volunteers.</strong> One stays at each desk; the third floats before each window.</li><li><strong>24 adult teams, one captain per check-in.</strong> This models 24 team transactions, not all 96 players moving through an entrance.</li><li><strong>Routine check-in:</strong> 2 teams per volunteer per five-minute window.</li><li><strong>Assisted check-in:</strong> 1 team per volunteer per window, for roster, payment, or non-digital questions.</li><li><strong>Both routes are independent FIFO queues.</strong> A volunteer’s unused capacity does not transfer mid-window. This is a simplified operational constraint.</li><li><strong>Safety provision and basic accessibility are protected.</strong> Assisted service is not a proxy for disability. No route can be closed, no team discarded, and no required check skipped.</li></ul></section>${forecast(M.initial(),true)}<section><h2>Transparent model and scoring</h2><p class="rate">Queue after each window = queue before + arrivals − completed<br>Routine completed = min(routine queue, routine staff × 2)<br>Assisted completed = min(assisted queue, assisted staff × 1)<br>Added waiting-team-minutes = all teams remaining × 5</p><p>At each window, arrivals join first, staffing takes effect for that entire window, and the oldest teams on each route are served first. Same-window arrival and service creates zero modeled queue delay. Delay excludes service time. The final queue remains unresolved at 09:00 and contributes its accrued wait.</p><p><strong>Compare readiness first:</strong> teams checked in out of 24 by 09:00. <strong>Then compare queue delay:</strong> lower accumulated waiting-team-minutes. Also inspect the separate route totals. A readiness tie and a smaller combined total need not settle whether the experience was better for everyone. The game does not award hidden judgment points or record a course grade.</p><p>These deterministic rates and arrivals are fictional teaching assumptions. The model omits variable transaction times, breaks, staff skill variation, and within-window transfers. It is not a staffing recommendation or a crowd-safety model.</p></section><details><summary>Worked outcomes and a useful teaching contrast</summary><div><p>Let R denote the number of volunteers at routine check-in in each of the six windows. Assisted staffing is always 3 − R.</p><div class="table-scroll"><table><thead><tr><th>R staffing sequence</th><th>Ready</th><th>Queue delay</th></tr></thead><tbody><tr><td>2, 2, 2, 2, 2, 2</td><td>23 / 24</td><td>65 team-min</td></tr><tr><td>2, 1, 2, 2, 2, 1</td><td>24 / 24</td><td>40 team-min</td></tr><tr><td>2, 1, 2, 1, 2, 2</td><td>24 / 24</td><td>50 team-min</td></tr></tbody></table></div><p>The 40 team-minute example is the lowest total among the 64 permitted staffing sequences that complete all 24 teams. The final R allocation can be 1 or 2 with the same result. Treat it as one mathematical benchmark, not the only defensible service objective.</p><p>In the third example, the additional assisted staffing during 08:45–08:50 reduces assisted delay but increases routine delay. Use the route totals to discuss that tradeoff. A pod can defend a service priority with evidence even when its combined delay is higher.</p></div></details><section><h2>Debrief questions</h2><ol><li>Which staffing change caused the clearest difference? Show the arrivals, capacity, and remaining queue.</li><li>Did a better combined result conceal a worse experience on one route?</li><li>What would the registration lead tell the competition lead at 09:00?</li><li>What data would you need before using this model at a real event?</li></ol><p><strong>Expected transfer:</strong> confirm role ownership, give volunteers an escalation route, plan a handoff for unresolved cases, and set measures before event day.</p></section><section><h2>Saving, sharing, and accessibility</h2><p>An optional pod alias and progress save in this browser when local storage is available. No login, student name, email, analytics, external dependency, or server submission is used. Nothing is sent to an instructor. Students can download a plain-text result with both runs and their notes. If you want to collect work, provide your usual submission channel separately.</p><p>Controls support keyboard and touch. The game advances only when the player selects a window. Pause, reduced motion, reload/resume, and a confirmed restart are available. Do not require speed to earn a better result.</p></section><section><h2>Reading alignment</h2><p>Michael Clemons and Ashley Dabb, supplied Chapter 14, <em>Event Management</em>: event operations and the script (printed p. 310), registration (p. 311), volunteer management (pp. 311–312), and planning/evaluation concepts. The forecast, service model, and game are instructor-created teaching extensions.</p></section>${footer()}</article>`;
