grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tile{background:white;border:1px solid var(--line);border-radius:8px;padding:21px}.tile .num{font-family:Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:white;font-weight:bold;margin-bottom:12px}.tile p{margin:0}.callout{background:#e7eef2;border-left:4px solid var(--blue);padding:18px 21px;border-radius:0 6px 6px 0;margin:22px 0}.callout p:last-child{margin-bottom:0}.callout.safe{background:var(--pale);border-color:var(--green)}.callout.warn{background:#fff2d5;border-color:#a56c00}.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:25px;flex-wrap:wrap}.button{display:inline-block;background:var(--navy);border:2px solid var(--navy);color:white;padding:12px 21px;border-radius:5px;font-weight:700;font-size:15px;text-decoration:none;min-height:48px}.button:hover{background:var(--blue);border-color:var(--blue)}.button.secondary{background:transparent;color:var(--navy)}.button.secondary:hover{background:#e3eaf0}.button:disabled{opacity:.5;cursor:not-allowed}.button.text{border-color:transparent;text-decoration:underline;font-size:13px;padding:7px;min-height:40px}.budget{border:1px solid var(--line);background:white;border-radius:6px;padding:11px 17px;font-size:13px;min-width:210px}.budget strong{font-size:21px;display:block}.budget.over{border-color:var(--red);color:var(--red)}nav{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 31px}nav button{background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 12px;color:var(--muted);font-size:13px;min-height:40px}nav button[aria-current=step]{background:var(--navy);color:white;border-color:var(--navy)}nav button:disabled{opacity:.5;cursor:not-allowed}fieldset{border:0;padding:0;margin:20px 0 0}legend{font-family:Arial,sans-serif;font-size:14px;font-weight:bold;margin-bottom:13px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.choice{position:relative;border:2px solid var(--line);border-radius:7px;background:white;padding:20px;cursor:pointer;display:block}.choice:has(input:checked){border-color:var(--blue);background:#eaf1f6;box-shadow:0 0 0 1px var(--blue)}.choice input{width:19px;height:19px;margin:0 8px 0 0;accent-color:var(--navy)}.choice .choice-head{display:flex;align-items:center;font-size:13px;font-weight:bold;color:var(--blue);margin-bottom:12px}.choice strong{display:block;font-family:Georgia,serif;font-size:22px;line-height:1.15;margin-bottom:12px}.choice p{font-family:Arial,sans-serif;font-size:14px;line-height:1.5}.choice .cost{font-size:18px;font-weight:bold;margin:18px 0 0;color:var(--navy)}.tradeoff{border-top:1px solid var(--line);padding-top:11px;color:var(--muted)}.feedback{margin-top:18px;background:var(--pale);padding:17px 21px;border-radius:6px;border:1px solid #bdd4c7}.feedback h3{font-family:Arial,sans-serif;font-size:16px}.feedback p{font-size:16px;margin:0}.status{min-height:22px;font-size:14px;color:var(--red);margin:12px 0}.check{font-family:Arial,sans-serif;display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:bold;margin-top:15px}.check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--green)}.handoff{display:grid;grid-template-columns:.85fr 1.15fr;gap:25px}.receipt{border:1px solid var(--line);background:white;padding:24px;border-radius:6px;align-self:start}.receipt ul{padding:0;list-style:none;margin:0}.receipt li{padding:13px 0;border-bottom:1px solid var(--line)}.receipt li:first-child{padding-top:0}.receipt .costline{font-family:Arial,sans-serif;font-size:14px;display:flex;justify-content:space-between;gap:12px;margin-top:20px}.formrow{margin-bottom:17px}.formrow label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px}textarea,select{width:100%;border:1px solid #899ba7;border-radius:5px;background:white;padding:11px;color:var(--ink);font-family:Arial,sans-serif;font-size:16px}textarea{min-height:90px;resize:vertical}.helper{font-family:Arial,sans-serif;color:var(--muted);font-size:12px;margin-top:5px}.memo{white-space:pre-wrap;background:white;padding:25px;border:1px solid var(--line);border-radius:6px;font-family:Georgia,serif;line-height:1.65}.debrief{margin:27px 0}.debrief li{margin-bottom:9px}.footer{border-top:1px solid var(--line);margin-top:35px;padding-top:20px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}.footer p{max-width:780px}details{margin-top:25px;font-size:14px}summary{cursor:pointer;font-family:Arial,sans-serif;font-weight:bold;padding:7px 0}details p{margin-top:12px}.badge{background:#e9f2ec;border:1px solid #a8c9b4;color:#175039;padding:6px 10px;border-radius:4px;font:12px Arial,sans-serif}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.print-only{display:none}[hidden]{display:none!important}@media(max-width:780px){.shell{padding:20px}.head{padding:16px 20px}.hero,.handoff{grid-template-columns:1fr}.hero{gap:20px;padding-top:15px}.grid,.choices{grid-template-columns:1fr}.brief-card{padding:22px}.topline{align-items:flex-start;flex-direction:column}.budget{width:100%}nav{gap:5px}nav button{font-size:12px;padding:8px}.choice{padding:18px}h1{font-size:43px}.footer{flex-direction:column}.actions .button{flex-grow:1;text-align:center}}@media print{header,nav,.actions,footer,details,.topline,.no-print{display:none!important}body{background:white;font-size:12pt}.shell{padding:0;max-width:none}.memo{border:0;padding:0}.print-only{display:block}.debrief{break-inside:avoid}h2{font-size:26pt}}

<body><a class="skip" href="#main">Skip to activity</a>
<header><div class="head"><div><div class="brand">THE SATURDAY DECISION DESK</div><div class="small gold">MGT 340 · Youth sport manager lab</div></div><div class="small">ONE POD · ONE DEVICE<br>10 minutes · Discussion, not a test</div></div></header>
<main class="shell" id="main" tabindex="-1"><noscript><div class="callout warn"><h2>Use the paper fallback</h2><p>JavaScript is needed for the interactive version. Open the <a href="facilitator-guide.html">facilitator guide</a> for the scenario, choices and printable handoff.</p></div></noscript><div id="app"></div></main>
<script>
'use strict';
const VERSION='youth-manager-v1';
const BUDGET=12000;
const CASES=[
{id:'access',title:'Who gets to stay in the game?',eyebrow:'Decision 1 of 3 · Access & family cost',time:'2 minutes',prompt:'Registration opens next week. Families report three barriers: the $450 season fee, transport to practice, and paying the whole fee at once. You can fund one access priority this season.',voice:'Parent message: “Before you sell us another development opportunity, make it possible for us to get to the field.”',options:[
{id:'aid',title:'Reduce the fee barrier',cost:6000,body:'Offer 20 confidential, need-based $300 fee credits. Publish eligibility and a simple request process.',tradeoff:'Deep support for 20 players; transport and families just above the threshold still need a plan.',consequence:'Your credits cover $6,000 in fees. Ask who never applies and whether transport still prevents attendance.',metric:'Retention of fee-credit recipients and unmet requests',owner:'Registration lead'},
{id:'transport',title:'Make attendance possible',cost:3000,body:'Fund an approved transport partner for a limited route serving practice and local games.',tradeoff:'Helps families on that route, but does not lower registration fees or reach every neighborhood.',consequence:'You removed one practical barrier. Check route access and actual attendance before calling the program equitable.',metric:'Route use and missed sessions among participating families',owner:'Operations lead'},
{id:'payments',title:'Spread the payment',cost:1000,body:'Set up no-interest installment plans and clear all-in price information before registration.',tradeoff:'Eases timing and surprise costs. It does not reduce the total fee for families who cannot afford it.',consequence:'Cash-flow relief is useful, but it is not a subsidy. Identify an unmet-need route for families still priced out.',metric:'Installment completion and withdrawals attributed to cost',owner:'Finance lead'}]},
{id:'pathway',title:'What counts as development?',eyebrow:'Decision 2 of 3 · Pathways & expectations',time:'2 minutes',prompt:'Some parents want early “elite” labels and more travel. Coaches see late developers and children who want to play other sports. Choose one development investment; the regular local season remains available to everyone.',voice:'Coach message: “A strong player today is not a guaranteed college athlete. How do we keep a route open for the kid who develops later?”',options:[
{id:'reassess',title:'Reopen the pathway',cost:2000,body:'Add two open reassessment dates with common criteria and a second trained evaluator.',tradeoff:'More chances and better process, but extra assessment can still create pressure and labeling.',consequence:'A second look improves opportunity only if criteria and invitations reach everyone. Do not market selection as a scholarship promise.',metric:'New entrants at reassessment, with review for access barriers',owner:'Coaching director'},
{id:'clinics',title:'Build skills without a label',cost:4000,body:'Offer eight optional, no-fee mixed-ability skill sessions with flexible attendance for multi-sport players.',tradeoff:'Broad skill access; paid coaching time is expensive and some families want a selective pathway.',consequence:'You invested in participation and development. Ask children what they value, and monitor who can actually attend.',metric:'Repeat attendance and an anonymous enjoyment check',owner:'Coaching director'},
{id:'training',title:'Improve everyday coaching',cost:1000,body:'Train volunteer coaches on age-appropriate goals, varied practice and clear parent communication.',tradeoff:'Reaches regular sessions cheaply, but training alone does not ensure behavior changes.',consequence:'Publish what coaches should do differently, then observe practice. A completed training module is an input, not proof of a better experience.',metric:'Observed coaching practices plus player feedback',owner:'Coach education lead'}]},
{id:'sideline',title:'The sideline crosses a line',eyebrow:'Decision 3 of 3 · Safety, voice & accountability',time:'2 minutes',prompt:'At Saturday’s game, an adult repeatedly shouts at a youth official and moves toward the field after being told to stop. A child says they no longer want to play. Apply the safety baseline, then choose one prevention investment.',voice:'Board message: “Protect people now. Review the incident fairly. Tell us who will own prevention next week.”',options:[
{id:'stewards',title:'Staff the busiest games',cost:4000,body:'Add trained, paid game-day stewards at the highest-attendance fixtures, separate from coaches.',tradeoff:'Clear authority and reliable cover at selected games; other fixtures still rely on existing staff.',consequence:'Give stewards a clear role, escalation route and coverage schedule. More staff is useful only where people know how to reach them.',metric:'Coverage and response time, alongside recurring incidents',owner:'Operations lead'},
{id:'rotation',title:'Build a trained rotation',cost:2000,body:'Train and schedule adult volunteer sideline hosts, with a designated supervisor and backup each day.',tradeoff:'Wider coverage at lower cost, but availability and consistent enforcement need active management.',consequence:'Use confirmed rosters and backup coverage, not a sign-up sheet alone. Hosts support the policy; children do not police adults.',metric:'Filled shifts and consistent incident follow-up',owner:'Volunteer coordinator'},
{id:'support',title:'Support officials & reporting',cost:3000,body:'Add an adult official mentor, a clear reporting route and post-game follow-up for affected participants.',tradeoff:'Stronger support and visibility; no extra steward at every game. Reports may rise as trust improves.',consequence:'A rise in reports may mean safer reporting, not more harm. Read the numbers alongside recurrence, response and participant trust.',metric:'Response time, repeat behavior and confidence in reporting',owner:'Officials coordinator'}]}
];
const KEY=VERSION;const blank=()=>({step:0,reached:0,choices:[null,null,null],safe:false,tradeoff:'',owner:'',metric:'',final:false});
function validState(s){return s&&Array.isArray(s.choices)&&s.choices.length===3&&s.choices.every((v,i)=>v===null||CASES[i].options.some(o=>o.id===v))&&Number.isInteger(s.step)&&s.step>=0&&s.step<=5&&Number.isInteger(s.reached)&&s.reached>=s.step&&s.reached<=5&&['tradeoff','owner','metric'].every(k=>typeof s[k]==='string'&&s[k].length<=500)&&typeof s.safe==='boolean'&&typeof s.final==='boolean'&&(!(s.step>=4||s.final)||(s.choices.every(Boolean)&&s.safe));}
let state=blank(),storageOK=true;try{const saved=JSON.parse(sessionStorage.getItem(KEY));if(validState(saved))state=saved;}catch(e){storageOK=false;}
const app=document.getElementById('app');const money=n=>'$'+n.toLocaleString('en-US');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function selected(i){return CASES[i].options.find(o=>o.id===state.choices[i]);}function spent(){return CASES.reduce((n,c,i)=>n+(selected(i)?.cost||0),0);}function save(){try{sessionStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
function footer(){return `<footer class="footer"><p>Fictional league, people and costs. This is a discussion model, not a prediction or graded assessment. No names, email, account or network submission. ${storageOK?'Progress stays in this browser tab until you clear it or close the session.':'Tab storage is unavailable; keep this page open and download your handoff.'} Do not enter personal information.</p><button class="button secondary text" data-action="reset">Start over / clear tab</button></footer>`;}
function stageTop(){return `<div class="topline"><div class="eyebrow">Director of Fairmount Community Soccer · Fictional scenario</div><div id="budget" class="budget ${spent()>BUDGET?'over':''}" aria-live="polite">Improvement budget<strong>${money(Math.abs(BUDGET-spent()))} ${spent()>BUDGET?'over budget':'remaining'}</strong>${money(spent())} allocated of ${money(BUDGET)}</div></div><nav aria-label="Activity stages">${['Brief','1 · Access','2 · Pathway','3 · Sideline','Handoff'].map((s,i)=>`<button data-step="${i}" ${i>state.reached?'disabled':''} ${state.step===i?'aria-current="step"':''}>${s}</button>`).join('')}</nav>`;}
function intro(){return `<div class="hero"><section><div class="eyebrow">Your league. Three decisions. Real tradeoffs.</div><h1>Keep kids in the game.</h1><p class="lead">You’re the new director of a community youth soccer league. Your pod is the leadership team. Make a plan the board can fund and families can trust.</p><p class="muted">Work in pods of 3–4. Use one device. Choose a director, a family/player advocate, and a finance/operations lead. A fourth person can challenge the group’s assumptions.</p><button class="button" data-action="start">Open the decision desk →</button></section><aside class="brief-card"><div class="eyebrow">The board’s brief</div><strong class="big">$12,000</strong><p>One-time improvement budget. Do not overspend.</p><p><strong>180 players · ages 9–12</strong><br>$450 season fee before optional costs.</p><p>Regular operations and required safety procedures are already funded.</p><div class="small gold">Mission: safe, enjoyable, accessible development.</div></aside></div><div class="grid"><section class="tile"><div class="num">1</div><h3>Read the brief</h3><p><b>1 minute.</b> Agree on the mission. Ask whose voice your pod needs to represent.</p></section><section class="tile"><div class="num">2</div><h3>Make three decisions</h3><p><b>6 minutes.</b> Pick an access policy, a pathway investment and a sideline response.</p></section><section class="tile"><div class="num">3</div><h3>Defend the plan</h3><p><b>1 minute + 2-minute debrief.</b> Name a tradeoff, an owner and a measurable check.</p></section></div><div class="callout"><strong>Not a hunt for a perfect score.</strong> The budget is real within this fictional case; the consequences are prompts to examine, not predicted outcomes. Safety is a requirement, not something you can trade for savings.</div><details><summary>Why these issues? Reading connection</summary><p>Project Play’s May 28, 2025 report found that 11% of surveyed youth-sport parents believed their child could reach professional or Olympic sport. That measures a belief, not a child’s actual probability. Its survey covered 1,848 parents of children ages 6–18 who regularly played sports, with data collected in November–December 2024.</p><p><a href="https://projectplay.org/news/project-play-survey-11-of-sports-parents-believe-their-child-can-go-pro" target="_blank" rel="noopener">Read the Project Play analysis</a>. Use the class readings to question costs, expectations and whose experience managers prioritize. All dollar amounts and situations in this activity are invented for teaching.</p><p>In Prime Video’s November 3, 2026 segment, Blake Griffin describes paying $80 for a spectator wristband and $60 for weekend parking. This is his reported experience, not an average fee or an audited cost. Ask what an all-in family price would disclose. <a href="https://www.primevideo.com/detail/0NJEOYOBDGPM5NAAHL2UX617I5?tr=um" target="_blank" rel="noopener">Official segment: Is Money Ruining Youth Sports?</a></p></details>`;}
function safety(){return `<div class="callout safe"><strong>Safety baseline. Every plan includes it.</strong><p>Use the league’s game-day protocol: pause play when safety is in doubt; move children and the official away from the confrontation; have the designated trained adult manage the situation without asking children to intervene. For immediate danger, use the emergency plan and emergency services.</p><p>Then document facts, support affected people, and route conduct review to the responsible league official under the published policy, including fair notice and appeal. Follow applicable safeguarding and reporting duties. Coaches do not improvise sanctions on the spot.</p><label class="check"><input id="safe" type="checkbox" ${state.safe?'checked':''}>Our pod will apply this baseline before debating prevention spending.</label></div>`;}
function decision(i){const c=CASES[i],o=selected(i);return `${stageTop()}<section aria-labelledby="stage-heading"><div class="eyebrow">${c.eyebrow} · ${c.time}</div><h2 id="stage-heading" tabindex="-1">${c.title}</h2><p class="lead">${c.prompt}</p><div class="callout"><p>${c.voice}</p>${i===1&&selected(0)?`<p class="small"><strong>Your earlier choice:</strong> ${selected(0).title}. You may revise earlier choices. The live budget above includes your full current package.</p>`:''}</div>${i===2?safety():''}<fieldset><legend>Choose one investment. Discuss who benefits and what remains unresolved.</legend><div class="choices">${c.options.map((x,j)=>`<label class="choice"><span class="choice-head"><input type="radio" name="decision" value="${x.id}" ${o?.id===x.id?'checked':''}>OPTION ${String.fromCharCode(65+j)}</span><strong>${x.title}</strong><p>${x.body}</p><p class="tradeoff"><b>Tradeoff:</b> ${x.tradeoff}</p><p class="cost">${money(x.cost)}</p></label>`).join('')}</div></fieldset><div id="feedback" class="feedback" ${o?'':'hidden'} aria-live="polite">${feedback(i)}</div><div id="error" class="status" role="alert"></div><div class="actions"><button class="button secondary" data-step="${i}">← Back</button><button class="button" data-action="next">${i===2?'Build our handoff':'Continue'} →</button></div></section>`;}
function feedback(i){const o=selected(i);return o?`<h3>Pressure-test your choice</h3><p>${o.consequence}</p>`:'';}
function receipt(){return `<aside class="receipt"><div class="eyebrow">Your investment package</div><ul>${CASES.map((c,i)=>`<li><strong>${c.title}</strong><br>${selected(i)?esc(selected(i).title):'Not selected'} <span class="small">${selected(i)?money(selected(i).cost):''}</span></li>`).join('')}</ul><div class="costline"><strong>Total ${money(spent())}</strong><span>${money(BUDGET-spent())} remaining</span></div><p class="helper">Unspent funds stay in reserve. No extra credit for using every dollar.</p></aside>`;}
function handoff(){return `${stageTop()}<div class="eyebrow">Board handoff · 1 minute</div><h2 id="stage-heading" tabindex="-1">Make it an operating plan.</h2><p class="lead">Choose one priority to implement first. One sentence or short phrase per field is enough. No names or personal information.</p><div class="handoff">${receipt()}<section><div class="formrow"><label for="tradeoff">1. Who is still underserved, and what will you do about it?</label><textarea id="tradeoff" maxlength="500" placeholder="A family/player group, a tradeoff, and one protection…">${esc(state.tradeoff)}</textarea></div><div class="formrow"><label for="owner">2. Who owns your first implementation step?</label><textarea id="owner" maxlength="500" placeholder="A league role + a concrete action before next Saturday…">${esc(state.owner)}</textarea></div><div class="formrow"><label for="metric">3. What will you check after 30 days?</label><textarea id="metric" maxlength="500" placeholder="One measure + what result would trigger a change…">${esc(state.metric)}</textarea></div><details><summary>Need a useful measure?</summary><ul>${CASES.map((c,i)=>`<li><b>${esc(selected(i)?.title||c.id)}:</b> ${esc(selected(i)?.metric||'')}</li>`).join('')}</ul><p>Define a starting point and threshold. Higher attendance alone does not prove enjoyment; more reports can reflect improved trust. Do not collect identifiable child data for this classroom exercise.</p></details></section></div><div id="error" class="status" role="alert"></div><div class="actions"><button class="button secondary" data-step="3">← Revise decisions</button><button class="button" data-action="finish">Create board handoff →</button></div>`;}
function memo(){return `THE SATURDAY DECISION DESK\nMGT 340 · Pod board handoff\n\nMission: safe, enjoyable, accessible development.\n\n${CASES.map((c,i)=>`${i+1}. ${selected(i)?.title||'Not selected'}: ${money(selected(i)?.cost||0)}`).join('\n')}\n\nTotal allocated: ${money(spent())} of ${money(BUDGET)}\nReserve: ${money(BUDGET-spent())}\nSafety baseline: acknowledged; applies to every plan.\n\nWho remains underserved + protection:\n${state.tradeoff}\n\nAccountable role + first step:\n${state.owner}\n\n30-day measure + trigger for change:\n${state.metric}\n\nFictional teaching scenario. Discussion artifact only; not submitted to the instructor or graded.`;}
function finished(){return `<div class="row"><span class="badge">Board handoff ready</span><span class="small muted">Saved only in this tab · Nothing submitted</span></div><h2 id="stage-heading" tabindex="-1">Now defend the tradeoff.</h2><p class="lead">Give the board a 30-second pitch: “We chose __ because __. We accept __ as the cost, and we will check __.”</p><div class="memo" id="memo">${esc(memo())}</div><div class="actions"><button class="button secondary" data-step="4">← Edit our handoff</button><div class="row"><button class="button secondary" data-action="download">Download handoff (.txt)</button><button class="button" data-action="print">Print / save PDF</button></div></div><div id="notice" class="status" role="status"></div><section class="debrief"><div class="eyebrow">Class debrief · 2 minutes</div><h3>Compare decisions, not scores.</h3><ol><li>Which child or family benefits most, and who is still left out?</li><li>What did your budget make you give up? What evidence could change your choice?</li><li>How will you know the policy improved the experience, rather than just producing more paperwork?</li></ol><p class="muted">Connect your answer to mission, planning, organizing, leading and evaluating. Your next task is the separate individual knowledge check when the instructor directs you.</p></section>`;}
function render(focus=false){app.innerHTML=(state.step===0?intro():state.step<=3?decision(state.step-1):state.step===4?handoff():finished())+footer();if(focus){document.getElementById('stage-heading')?.focus();window.scrollTo(0,0);}}
function go(n){state.step=n;state.reached=Math.max(state.reached,n);save();render(true);}
function error(s){document.getElementById('error').textContent=s;}
app.addEventListener('change',e=>{if(e.target.name==='decision'){state.choices[state.step-1]=e.target.value;state.final=false;save();const f=document.getElementById('feedback');f.innerHTML=feedback(state.step-1);f.hidden=false;const b=document.getElementById('budget');b.className='budget '+(spent()>BUDGET?'over':'');b.innerHTML=`Improvement budget<strong>${money(Math.abs(BUDGET-spent()))} ${spent()>BUDGET?'over budget':'remaining'}</strong>${money(spent())} allocated of ${money(BUDGET)}`;document.getElementById('error').textContent='';}if(e.target.id==='safe'){state.safe=e.target.checked;state.final=false;save();}});
app.addEventListener('input',e=>{if(['tradeoff','owner','metric'].includes(e.target.id)){state[e.target.id]=e.target.value;state.final=false;save();}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.step!==undefined){go(Number(b.dataset.step));return;}switch(b.dataset.action){case 'start':go(1);break;case 'next':{const i=state.step-1;if(!selected(i)){error('Choose one investment before continuing.');return;}if(i===2&&!state.safe){error('Acknowledge the safety baseline before building the handoff.');document.getElementById('safe').focus();return;}if(i===2&&spent()>BUDGET){error(`Your plan is ${money(spent()-BUDGET)} over budget. Revisit one decision before creating a handoff.`);return;}go(state.step+1);break;}case 'finish':if(!state.choices.every(Boolean)||!state.safe){error('Complete all three choices and the safety baseline first.');return;}if(spent()>BUDGET){error('Your package is over budget. Revise one investment.');return;}if(['tradeoff','owner','metric'].some(k=>!state[k].trim())){error('Add a short response to each of the three handoff fields.');return;}state.final=true;go(5);break;case 'download':{const url=URL.createObjectURL(new Blob([memo()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='MGT340-Saturday-Decision-Desk-Handoff.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);document.getElementById('notice').textContent='Download requested. This is your local copy, not an instructor submission.';break;}case 'print':window.print();break;case 'reset':if(confirm('Clear this tab’s choices and handoff and start again? Download your handoff first if you want a copy.')){state=blank();try{sessionStorage.removeItem(KEY);}catch(e){}render();window.scrollTo(0,0);}break;}});
render();
</script>
</body></html>
