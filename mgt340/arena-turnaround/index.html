<script id="game-engine">
/* Deterministic model. Kept separate from the interface so its logic can be tested. */
(function(root){
'use strict';
const CONFIG=Object.freeze({version:1,deadline:7,maxHour:12,crewCount:3,maxPerTask:2,baseContribution:5000,overtimeRate:600});
const KEYS=['loadout','floor','reset'];
function requirements(mode){return {loadout:4,floor:mode==='stretch'?8:6,reset:4};}
function create(mode='standard'){if(!['standard','stretch'].includes(mode))throw Error('Unknown challenge');return {mode,hour:0,done:{loadout:0,floor:0,reset:0},phase:'work',log:[],inspectionComplete:false};}
function available(state,key){if(!KEYS.includes(key)||state.phase!=='work')return 0;const req=requirements(state.mode);if(key==='floor'&&state.done.loadout<req.loadout)return 0;return Math.min(CONFIG.maxPerTask,req[key]-state.done[key]);}
function validateAllocation(state,allocation){if(state.phase!=='work')return 'This shift is not accepting crew assignments.';if(!allocation||typeof allocation!=='object')return 'Choose a crew allocation.';let total=0;for(const key of KEYS){const value=allocation[key];if(!Number.isInteger(value)||value<0||value>CONFIG.maxPerTask)return 'Assign zero, one, or two crews to each task.';if(value>available(state,key))return key==='floor'&&state.done.loadout<requirements(state.mode).loadout?'Floor conversion starts in the hour after load-out is complete.':'A completed task cannot use more crews than its remaining work.';total+=value;}if(total>CONFIG.crewCount)return 'Only three crews are available in each hour.';return null;}
function work(state,allocation){const error=validateAllocation(state,allocation);if(error)throw Error(error);const next=structuredCloneSafe(state);const startHour=state.hour;for(const key of KEYS)next.done[key]+=allocation[key];next.hour+=1;const req=requirements(next.mode);const finished=KEYS.every(key=>next.done[key]===req[key]);const loadoutJustFinished=state.done.loadout<req.loadout&&next.done.loadout===req.loadout;next.log.push({kind:'work',start:startHour,end:next.hour,allocation:{loadout:allocation.loadout,floor:allocation.floor,reset:allocation.reset},done:{...next.done},loadoutJustFinished,allWorkComplete:finished});if(next.hour>=CONFIG.maxHour){next.phase='stopped';}else if(finished){next.phase='inspection';}return next;}
function inspect(state){if(state.phase!=='inspection')throw Error('All three work tasks must finish before inspection.');const next=structuredCloneSafe(state);next.log.push({kind:'inspection',start:state.hour,end:state.hour+1});next.hour+=1;next.inspectionComplete=true;next.phase='complete';return next;}
function structuredCloneSafe(value){return JSON.parse(JSON.stringify(value));}
function outcome(state){const ready=state.phase==='complete'&&state.inspectionComplete;const overtimeHours=Math.max(0,state.hour-CONFIG.deadline);return {ready,onTime:ready&&state.hour<=CONFIG.deadline,readyHour:ready?state.hour:null,buffer:ready?Math.max(0,CONFIG.deadline-state.hour):0,overtimeHours,overtimeCost:overtimeHours*CONFIG.overtimeRate,contribution:CONFIG.baseContribution-overtimeHours*CONFIG.overtimeRate};}
function isValidState(state){if(!state||!['standard','stretch'].includes(state.mode)||!Number.isInteger(state.hour)||state.hour<0||state.hour>CONFIG.maxHour||!['work','inspection','complete','stopped'].includes(state.phase)||!Array.isArray(state.log)||state.log.length>CONFIG.maxHour)return false;try{let rebuilt=create(state.mode);for(const item of state.log){if(item.kind==='work')rebuilt=work(rebuilt,item.allocation);else if(item.kind==='inspection')rebuilt=inspect(rebuilt);else return false;}return JSON.stringify(rebuilt)===JSON.stringify(state);}catch{return false;}}
root.ArenaTurnaroundEngine=Object.freeze({CONFIG,KEYS,requirements,create,available,validateAllocation,work,inspect,outcome,isValidState});
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>
(function(){
'use strict';
const E=window.ArenaTurnaroundEngine;
const STORE='jflevine_mgt340_arena_turnaround_v1';
const $=id=>document.getElementById(id);
const labels={loadout:'Load-out',floor:'Floor conversion',reset:'Guest-area reset'};
let saving=true,savedNotice='',errorMessage='',allocation={loadout:0,floor:0,reset:0};
let app={version:1,alias:'',current:null,history:[],reflection:{bottleneck:'',change:''}};
const guide=new URLSearchParams(location.search).get('guide')==='1';
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return (n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US');}
function clock(n){return String(n).padStart(2,'0')+':00';}
function duration(n){return n+' hour'+(n===1?'':'s');}
function modeName(mode){return mode==='stretch'?'Stretch challenge':'Standard rehearsal';}
function updateStorageStatus(){if(!$('storage-status'))return;$('storage-status').textContent=saving?'Results stay in this browser. No submission or shared scoreboard.':'Browser saving is unavailable. Keep this tab open or download your results.';}
function save(){try{localStorage.setItem(STORE,JSON.stringify(app));}catch{saving=false;}updateStorageStatus();}
function load(){let raw;try{raw=localStorage.getItem(STORE);}catch{saving=false;return;}try{if(!raw)return;const parsed=JSON.parse(raw);if(!parsed||parsed.version!==1||typeof parsed.alias!=='string'||parsed.alias.length>60||!Array.isArray(parsed.history)||parsed.history.length>12||(parsed.current&&!E.isValidState(parsed.current)))throw Error('Invalid saved state');if(parsed.history.some(s=>!E.isValidState(s)||!['complete','stopped'].includes(s.phase)))throw Error('Invalid saved result');app={version:1,alias:parsed.alias,current:parsed.current,history:parsed.history,reflection:{bottleneck:String(parsed.reflection?.bottleneck||'').slice(0,800),change:String(parsed.reflection?.change||'').slice(0,800)}};if(app.current)savedNotice='Saved shift resumed on this browser. New group? Use “New pod / reset” above.';}catch{savedNotice='An older or incomplete save could not be resumed. Start a fresh rehearsal below.';app={version:1,alias:'',current:null,history:[],reflection:{bottleneck:'',change:''}};}}

function focusMain(){requestAnimationFrame(()=>$('main').focus({preventScroll:true}));}
function jumpTop(){window.scrollTo({top:0,behavior:'auto'});focusMain();}
function arena(state){const req=E.requirements(state?.mode||'standard');const done=state?.done||{loadout:0,floor:0,reset:0};const floor=done.floor/req.floor;const cleared=done.loadout===req.loadout;const guests=done.reset===req.reset;const ready=state?.inspectionComplete;const stageBoxes=Array.from({length:4},(_,i)=>`<rect x="${125+i*42}" y="114" width="35" height="62" rx="4" fill="${i<4-done.loadout?'#c1afcf':'#4f6278'}" opacity="${i<4-done.loadout?1:.22}"/>`).join('');return `<div class="arena-card"><div class="eyebrow">Franklin Arena · Fictional venue</div><h2>${ready?'Ready for the tenant':state?.phase==='stopped'?'Shift ended without sign-off':state?.phase==='inspection'?'Work complete. Sign-off next.':floor===1?'Court ready. Guest reset remains.':cleared?(floor>0?'Court conversion in progress':'Court conversion can begin'):'Concert out. Basketball next.'}</h2><svg viewBox="0 0 430 275" role="img" aria-label="Arena status diagram. Load-out ${done.loadout} of 4, floor conversion ${done.floor} of ${req.floor}, guest reset ${done.reset} of 4. ${ready?'Inspection complete.':'Inspection pending.'}"><rect x="14" y="22" width="402" height="226" rx="100" fill="#2a405b" stroke="#8496aa" stroke-width="2"/><rect x="36" y="44" width="358" height="182" rx="82" fill="none" stroke="#536d87" stroke-width="15" stroke-dasharray="4 7"/><rect x="75" y="72" width="280" height="142" rx="10" fill="#172b44" stroke="#8496aa" stroke-width="2"/><rect x="76" y="73" width="${278*floor}" height="140" rx="8" fill="#d3a66a"/><g fill="none" stroke="${floor>0?'#f8efda':'#435a73'}" stroke-width="2" opacity="${floor>0?1:.75}"><rect x="88" y="85" width="254" height="116" rx="2"/><path d="M215 85v116M88 116h45v53H88M342 116h-45v53h45"/><circle cx="215" cy="143" r="23"/><path d="M88 97a54 54 0 0 1 0 92M342 97a54 54 0 0 0 0 92"/></g>${!cleared?stageBoxes:''}<rect x="192" y="15" width="46" height="18" rx="4" fill="${guests?'#baeee0':'#f4c564'}"/><rect x="192" y="239" width="46" height="18" rx="4" fill="${guests?'#baeee0':'#f4c564'}"/><text x="215" y="269" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#d6e5ef">${guests?'GUEST AREAS RESET':'GUEST AREAS NEED RESET'}</text>${ready?'<circle cx="354" cy="56" r="24" fill="#baeee0"/><path d="m343 56 7 7 15-16" fill="none" stroke="#056f66" stroke-width="4"/>':''}</svg><p class="arena-caption">Schematic progress display, not a building plan</p><div class="arena-key"><span><i class="dot blue"></i>Load-out</span><span><i class="dot"></i>Court</span><span><i class="dot mint"></i>Guest areas</span></div></div>`;}
function rules(){return `<details class="rules"><summary>Exact rules and how outcomes work</summary><div class="body"><p><strong>Each trained crew completes 1 crew-hour of work per hour.</strong> You have 3 crews. A task can use at most 2 at once. All times and costs below are invented teaching assumptions.</p><div class="table-wrap"><table><thead><tr><th scope="col">Task</th><th scope="col">Work required</th><th scope="col">When it can start</th></tr></thead><tbody><tr><th scope="row">Load-out</th><td>4 crew-hours</td><td>Midnight</td></tr><tr><th scope="row">Floor conversion</th><td>6 standard / 8 stretch</td><td>Hour after load-out finishes</td></tr><tr><th scope="row">Guest-area reset</th><td>4 crew-hours</td><td>Midnight, alongside other work</td></tr><tr><th scope="row">Inspection and sign-off</th><td>1 additional full hour</td><td>After every work task finishes</td></tr></tbody></table></div><p style="margin-top:15px">An authorized venue lead performs the required inspection. It checks the completed layout, usable access, and readiness before handover. The game never permits opening without it.</p><p><strong>Outcome order:</strong> protect the 07:00 tenant handover, preserve event contribution, then compare the readiness buffer. There is no hidden composite score.</p><p>The venue's <strong>$5,000 base event contribution</strong> already subtracts scheduled conversion work, staffed inspection, and required services through 07:00. Finishing earlier does not change that contracted cost. Each hour past 07:00 adds <strong>$600 incremental overtime</strong>, counted once. Contribution = $5,000 − overtime hours × $600. It is not annual profit. Wider delay costs are outside this model.</p><p>Idle crews are allowed. Sometimes a dependency or the two-crew task limit leaves no productive assignment. Identical assignments produce identical outcomes. A run stops at noon if inspection has not finished; that is an <strong>unready venue</strong>, regardless of its remaining contribution.</p></div></details>`;}
function intro(){return `${savedNotice?`<div class="notice">${esc(savedNotice)}</div>`:''}<section class="hero"><div class="hero-copy"><div class="eyebrow">A facility management shift challenge</div><h1>The concert is over.<br>You're on the clock.</h1><p class="lead">Your arena's basketball tenant needs the venue at <strong>07:00</strong>. Assign three trained crews, complete the conversion, and leave time for required inspection.</p><p class="podline">Self-selected pods of 3–4 · One device · 15 minutes with replay</p><div class="intro-facts"><div class="fact"><strong>00:00</strong><span>Your shift begins</span></div><div class="fact"><strong>3 crews</strong><span>Reassign each hour</span></div><div class="fact"><strong>07:00</strong><span>Protected handover</span></div></div></div>${arena(null)}</section><section class="start-grid"><div class="card"><h2>One decision each hour</h2><div class="howto"><span class="n">1</span><p>Use <strong>+ / −</strong> to assign crews. Load-out must finish before court conversion begins.</p></div><div class="howto"><span class="n">2</span><p>Run an hour, read what changed, and reassign. Guest areas can reset in parallel.</p></div><div class="howto"><span class="n">3</span><p>Complete the final <strong>one-hour inspection</strong>. Review your result, then replay the same workload to improve your plan.</p></div></div><div class="card"><h2 style="margin-bottom:19px">Take the night shift</h2><label class="field-label" for="team-alias">Pod alias <span class="small">(optional)</span></label><span class="field-hint">Use a made-up team name. No names, email addresses, or accounts needed.</span><input id="team-alias" type="text" maxlength="60" autocomplete="off" value="${esc(app.alias)}" placeholder="e.g., Night Owls"><div class="actions"><button class="button primary full" id="start-standard">Start the rehearsal</button></div><p class="privacy">Assign an operator, a scheduler, and a challenger. A fourth person can track the cost. Rotate roles for the second run.</p><p class="privacy"><strong>Browser-only practice:</strong> nothing is submitted to your instructor. Download your results when finished.</p></div></section>${rules()}`;}
function metrics(state){const out=E.outcome(state);const complete=state.phase==='complete';return `<section class="scoreboard" aria-label="Shift dashboard"><div class="metric"><div class="label">${complete?'Venue ready':'Current time'}</div><div class="value">${clock(state.hour)}</div><div class="sub">Saturday morning</div></div><div class="metric ${state.hour>=7?'warning':''}"><div class="label">Tenant handover</div><div class="value">07:00</div><div class="sub">${out.onTime?duration(out.buffer)+' readiness buffer':state.hour<7?duration(7-state.hour)+' until handover':out.ready?'Handover missed by '+duration(state.hour-7):state.hour===7?'Deadline reached':'Deadline passed by '+duration(state.hour-7)}</div></div><div class="metric"><div class="label">Work tasks</div><div class="value">${E.KEYS.filter(k=>state.done[k]===E.requirements(state.mode)[k]).length} / 3</div><div class="sub">${state.inspectionComplete?'Inspection also complete':'Then one-hour inspection'}</div></div><div class="metric ${out.overtimeHours?'warning':''}"><div class="label">Event contribution${complete?'':' so far'}</div><div class="value">${money(out.contribution)}</div><div class="sub">${out.overtimeHours?money(out.overtimeCost)+' incremental overtime':'Base '+money(E.CONFIG.baseContribution)+' after scheduled costs'}</div></div></section>`;}
function planSummary(state){const req=E.requirements(state.mode);return `<div class="card"><h3>Handover checklist</h3><ul class="timing-list">${E.KEYS.map(k=>`<li><span>${state.done[k]===req[k]?'<span class="mini-check" aria-label="Complete">✓</span>':'<span aria-hidden="true">○</span>'} ${labels[k]}</span><strong>${state.done[k]} / ${req[k]}</strong></li>`).join('')}<li><span>${state.inspectionComplete?'<span class="mini-check">✓</span>':'<span aria-hidden="true">○</span>'} Inspection and sign-off</span><strong>1 hour</strong></li></ul><p class="small" style="margin-top:17px">Conversion complete does not mean tenant ready. Sign-off uses its own full hour.</p><div class="timeline" aria-label="Timeline from midnight to the seven o'clock deadline">${Array.from({length:8},(_,i)=>`<div class="time-tick ${i<state.hour?'done':''} ${i===state.hour?'current':''} ${i===7?'deadline':''}">${clock(i)}</div>`).join('')}</div></div>`;}
function workPanel(state){const req=E.requirements(state.mode),total=E.KEYS.reduce((n,k)=>n+allocation[k],0);const taskNotes={loadout:'Remove the concert setup so court work can begin',floor:'Only starts in the hour after load-out finishes',reset:'Reset guest areas and usable routes in parallel'};return `<section class="card" aria-labelledby="assign-title"><div class="allocation-heading"><h2 id="assign-title">${clock(state.hour)}–${clock(state.hour+1)} assignments</h2><div class="available" id="crew-available">${3-total} of 3<br>crews unassigned</div></div>${errorMessage?`<div class="notice error" role="alert">${esc(errorMessage)}</div>`:''}<div class="tasks">${E.KEYS.map((key,i)=>{const isLocked=key==='floor'&&state.done.loadout<4;const complete=state.done[key]===req[key];return `<div class="task ${isLocked?'locked':''} ${complete?'complete':''}"><div class="task-top"><div><div class="task-title"><span class="task-letter" aria-hidden="true">${String.fromCharCode(65+i)}</span><h3>${labels[key]}</h3></div><p id="${key}-note" class="task-note">${complete?'Task complete':isLocked?'Locked until load-out finishes':taskNotes[key]}</p></div><div class="stepper"><button type="button" data-task="${key}" data-delta="-1" id="less-${key}" aria-label="Remove one crew from ${labels[key]}" aria-describedby="${key}-note" ${allocation[key]===0?'disabled':''}>−</button><output id="count-${key}" aria-label="${labels[key]} assigned crews">${allocation[key]}</output><button type="button" data-task="${key}" data-delta="1" id="more-${key}" aria-label="Add one crew to ${labels[key]}" aria-describedby="${key}-note" ${allocation[key]>=E.available(state,key)||total>=3?'disabled':''}>+</button></div></div><div class="task-progress"><div class="progress-line"><span>${state.done[key]} of ${req[key]} crew-hours complete</span><span>${complete?'Done':req[key]-state.done[key]+' remaining'}</span></div><div class="bar" role="progressbar" aria-label="${labels[key]} progress" aria-valuenow="${state.done[key]}" aria-valuemin="0" aria-valuemax="${req[key]}"><div style="width:${100*state.done[key]/req[key]}%"></div></div></div></div>`;}).join('')}</div><div class="allocation-foot"><p class="small">${total===0?'Assign crews above, then advance the clock.':total<3?`${3-total} crew${3-total===1?' is':'s are'} idle this hour. That's allowed; check whether they could help elsewhere.`:'All three crews are assigned. Tasks progress together for one full hour.'}</p><button class="button primary" id="run-hour">Run 1 hour</button></div><p class="short-model">At most 2 crews per task. One crew does 1 crew-hour of work. Work completed this hour unlocks dependent work next hour.</p></section>`;}
function inspectionPanel(state){return `<section class="inspection"><span class="badge">All work tasks complete</span><h2>One hour still belongs to the building</h2><p>The authorized venue lead must inspect and sign off on the converted venue before the tenant can use it.</p><ul><li>Floor and event configuration</li><li>Guest areas and usable access</li><li>Required readiness checks and handover</li></ul><p><strong>Inspection: ${clock(state.hour)}–${clock(state.hour+1)}</strong></p><button class="button primary full" id="inspect" style="margin-top:19px">Complete the 1-hour inspection</button><p class="small" style="margin-top:12px">The game requires this hour. No opening or handover is available before sign-off.</p></section>`;}
function logPanel(state,open=false){return `<section class="log"><h2>Shift record</h2>${state.log.length?`<details ${open?'open':''}><summary style="cursor:pointer;font-size:.86rem;margin-bottom:10px">${state.log.length} completed hour${state.log.length===1?'':'s'} · newest first</summary>${state.log.slice().reverse().map(item=>`<div class="log-entry"><strong>${clock(item.start)}<br><span class="small">to ${clock(item.end)}</span></strong><div>${item.kind==='inspection'?'<strong>Inspection and sign-off complete</strong>':E.KEYS.filter(k=>item.allocation[k]).map(k=>`${labels[k]}: ${item.allocation[k]} crew${item.allocation[k]===1?'':'s'}`).join(' · ')||'All crews idle'}<p class="detail">${item.kind==='inspection'?'The venue is now ready for tenant use.':item.allWorkComplete?'All work complete. A full inspection hour still remains.':item.loadoutJustFinished?'Load-out complete. Floor conversion is available next hour.':`Completed work: ${item.done.loadout} load-out, ${item.done.floor} floor, ${item.done.reset} guest reset crew-hours.`}</p></div></div>`).join('')}</details>`:'<p class="log-empty">Your first completed hour will appear here.</p>'}</section>`;}
function active(state){return `${savedNotice?`<div class="notice">${esc(savedNotice)}</div>`:''}<div class="game-heading"><div><div class="eyebrow">${esc(app.alias)||'Your pod'} · ${modeName(state.mode)}</div><h1>Protect the next booking</h1><p class="small">Saturday's tenant is due at 07:00. Complete every task, then inspect.</p></div><button class="button secondary" id="restart-round">Restart this run</button></div>${state.mode==='stretch'?'<div class="notice warning"><strong>Announced change:</strong> this court setup needs 8 crew-hours, up from 6. The deadline and three-crew limit stay the same. Plan the extra work before advancing.</div>':''}${metrics(state)}<div class="play-grid"><div class="left-column">${arena(state)}${planSummary(state)}</div><div class="right-column">${state.phase==='inspection'?inspectionPanel(state):workPanel(state)}${logPanel(state,true)}</div></div>${rules()}`;}
function feedback(state){const out=E.outcome(state);const req=E.requirements(state.mode);const loadDone=state.log.find(x=>x.kind==='work'&&x.done.loadout===4)?.end;const floorDone=state.log.find(x=>x.kind==='work'&&x.done.floor===req.floor)?.end;const resetDone=state.log.find(x=>x.kind==='work'&&x.done.reset===4)?.end;const firstFloor=state.log.find(x=>x.kind==='work'&&x.allocation.floor>0)?.start;const observations=[];if(loadDone!=null){observations.push(`Load-out finished at ${clock(loadDone)}. ${firstFloor==null?'Floor conversion never started.':`Floor conversion began at ${clock(firstFloor)}${firstFloor>loadDone?' after '+duration(firstFloor-loadDone)+' of waiting':''}.`}`);}else observations.push('Load-out never finished, so floor conversion never became available.');if(floorDone!=null&&resetDone!=null){const last=floorDone>resetDone?'Floor conversion':resetDone>floorDone?'Guest-area reset':'Floor conversion and guest reset';observations.push(`${last} set the work finish at ${clock(Math.max(floorDone,resetDone))}. Inspection then required another full hour.`);}if(!out.ready)observations.push('The noon model limit stopped this run without completed sign-off. A positive contribution estimate cannot make an unready building acceptable.');else if(out.onTime)observations.push(out.buffer?`Your venue was ready ${duration(out.buffer)} before the protected booking. That buffer absorbs schedule pressure; the contracted base cost stays the same.`:'You protected the tenant booking with no spare hour. That is feasible in this deterministic model, but it leaves no readiness buffer.');else observations.push(`You missed the protected handover by ${duration(state.hour-7)}. ${money(out.overtimeCost)} of additional overtime reduced this event's contribution.`);return observations;}
function results(state){const out=E.outcome(state);const title=out.onTime?(out.buffer?'Tenant protected. An hour to spare.':'Tenant protected. Just in time.'):out.ready?'Venue ready, but the tenant waited.':'No sign-off. No tenant handover.';const status=out.onTime?'On-time readiness':out.ready?'Late readiness':'Venue unready';return `<div class="game-heading"><div><div class="eyebrow">${esc(app.alias)||'Your pod'} · ${modeName(state.mode)}</div><h1>Your shift result</h1></div><button class="button secondary" id="download">Download results</button></div><section class="result-hero ${!out.onTime?'late':''}"><div class="eyebrow">${status}</div><h2>${title}</h2><p>${out.ready?`Required work and sign-off finished at ${clock(state.hour)}. The protected tenant time was 07:00.`:'The model ended at 12:00 with required work or inspection unfinished. The building cannot be handed over.'}</p></section><div style="margin-top:22px">${metrics(state)}</div><div class="result-grid"><section class="card"><h3>What your plan caused</h3>${feedback(state).map(t=>`<p class="explanation">${esc(t)}</p>`).join('')}<div class="math" style="margin-top:20px">${money(5000)} − (${out.overtimeHours} × ${money(600)}) = ${money(out.contribution)}<br><span class="small">${out.ready?'Event contribution after incremental overtime':'Contribution estimate at model stop; no successful handover'}</span></div><p class="small" style="margin-top:13px">Scheduled labor and required services already sit inside the $5,000 base contribution. This calculation subtracts only extra overtime. Annual fixed costs and broader delay effects remain outside the model.</p><div class="actions"><button class="button primary" id="replay">Replay the same challenge</button>${state.mode==='standard'?'<button class="button secondary" id="next-challenge">Optional stretch challenge</button>':''}</div><p class="small" style="margin-top:12px">${state.mode==='standard'?'Replay uses the same workload so you can compare your scheduling. Optional stretch adds 2 floor-conversion crew-hours; compare only like challenges.':'Want a fresh group to start from the beginning? Use “New pod / reset” above.'}</p></section><section class="card"><h3>Your 60-second debrief</h3><p class="small" style="margin-bottom:18px">Discuss first. Optional notes travel with your downloaded result.</p><div class="reflection"><div><label class="field-label" for="bottleneck">What set your finish time?</label><textarea id="bottleneck" maxlength="800" placeholder="Name the task or dependency and explain why.">${esc(app.reflection.bottleneck)}</textarea></div><div><label class="field-label" for="change">What would you change, and why?</label><textarea id="change" maxlength="800" placeholder="Connect a crew decision to time, readiness, or contribution.">${esc(app.reflection.change)}</textarea></div></div><p class="privacy">Nothing here is graded or automatically submitted. Keep the downloaded file if your instructor asks for your group's result.</p></section></div>${historyPanel()}<section class="card" style="margin-top:23px">${logPanel(state,false)}</section>${rules()}`;}
function historyPanel(){if(!app.history.length)return '';return `<section class="card history"><h2>Runs on this browser</h2><p class="small" style="margin-bottom:12px">Your pod's last ${app.history.length} run${app.history.length===1?'':'s'}. Compare runs of the same challenge. This is not a shared class scoreboard.</p><div class="table-wrap"><table><thead><tr><th scope="col">Run</th><th scope="col">Challenge</th><th scope="col">Readiness</th><th scope="col">Ready time</th><th scope="col">Contribution</th></tr></thead><tbody>${app.history.map((s,i)=>{const o=E.outcome(s);return `<tr><th scope="row">${i+1}</th><td>${modeName(s.mode)}</td><td>${o.onTime?'On time':o.ready?'Late':'Unready'}</td><td>${o.ready?clock(s.hour):'Not ready'}</td><td>${money(o.contribution)}${o.ready?'':'*'}</td></tr>`;}).join('')}</tbody></table></div>${app.history.some(s=>!E.outcome(s).ready)?'<p class="small" style="margin-top:10px">* Unready runs show a contribution estimate at the noon stop, not a successful outcome.</p>':''}</section>`;}
function guidePage(){return `<article class="guide"><div class="eyebrow">Public instructor guide · No password</div><h1>Time is venue capacity</h1><p style="font-size:1.08rem">Arena Turnaround makes one facility management idea visible: a calendar must reserve setup, conversion, and verified handover time. An empty building is not necessarily available to sell.</p><div class="actions"><a class="button primary" href="./">Open the student game</a><button class="button secondary" id="print-guide">Print guide</button></div><section class="card"><h2>A 15-minute classroom route</h2><div class="table-wrap"><table><thead><tr><th scope="col">Minutes</th><th scope="col">What students do</th></tr></thead><tbody><tr><th scope="row">0–2</th><td>Form self-selected pods of 3–4. One device per pod. Assign operator, scheduler, challenger, and optional cost recorder.</td></tr><tr><th scope="row">2–7</th><td>Play the standard rehearsal. Read the visible task dependencies before spending an hour.</td></tr><tr><th scope="row">7–11</th><td>Rotate the operator. Replay the same standard workload and try to improve the scheduling. Save the optional stretch challenge for early finishers.</td></tr><tr><th scope="row">11–15</th><td>Compare results and explain the bottleneck. Hear two contrasting plans. Download or jot the outcome if desired.</td></tr></tbody></table></div></section><section class="card"><h2>The outcome model</h2><p>There are no hidden points, simulated injuries, random breakdowns, or safety shortcuts. Success means <strong>required work plus a full inspection hour complete by 07:00</strong>. Among ready plans, compare contribution and readiness buffer.</p><p><strong>Three trained crews</strong> each complete 1 unit of work per hour. At most 2 crews work on one task. Load-out needs 4 crew-hours; floor conversion needs 6 in the rehearsal and 8 in the stretch challenge. Floor work starts only in an hour after load-out finishes. Guest-area reset needs 4 and can run in parallel.</p><p>An authorized lead spends <strong>one separate full hour</strong> on inspection and sign-off after every work task finishes. These aggregate tasks stand in for qualified venue procedures; the model is not a staffing or safety specification.</p><p><strong>Contribution = $5,000 − $600 × max(0, ready hour − 7).</strong> The base already includes scheduled conversion, staffed inspection, and required services through 07:00. Finishing early does not produce an invented refund. Extra overtime is counted once. Contribution is not annual profit, and wider tenant-delay costs are outside this model.</p><p>A run with no sign-off at noon stops as <strong>unready</strong>, even if a positive contribution estimate remains. Identical choices produce identical outcomes.</p></section><section class="card"><h2>One efficient rehearsal plan</h2><div class="table-wrap"><table><thead><tr><th scope="col">Hour</th><th scope="col">Load-out</th><th scope="col">Floor</th><th scope="col">Guest reset</th><th scope="col">Result</th></tr></thead><tbody><tr><th scope="row">00:00–01:00</th><td>2 crews</td><td>Locked</td><td>1 crew</td><td>Load-out 2/4; reset 1/4</td></tr><tr><th scope="row">01:00–02:00</th><td>2 crews</td><td>Locked</td><td>1 crew</td><td>Load-out complete; reset 2/4</td></tr><tr><th scope="row">02:00–03:00</th><td>Done</td><td>2 crews</td><td>1 crew</td><td>Floor 2/6; reset 3/4</td></tr><tr><th scope="row">03:00–04:00</th><td>Done</td><td>2 crews</td><td>1 crew</td><td>Floor 4/6; reset complete</td></tr><tr><th scope="row">04:00–05:00</th><td>Done</td><td>2 crews</td><td>Done</td><td>All work complete; one crew idle</td></tr><tr><th scope="row">05:00–06:00</th><td colspan="3">Authorized lead completes required inspection</td><td>Ready at 06:00; 1-hour buffer</td></tr></tbody></table></div><p style="margin-top:17px"><strong>Why 06:00 is the earliest:</strong> load-out needs at least 2 hours, then floor conversion needs at least 3, then inspection needs 1. The reset fits alongside that chain. In the stretch challenge, floor work needs at least 4 hours, so earliest readiness is <strong>07:00</strong>. Both retain $5,000 contribution.</p><p>There are other valid sequences. A rehearsal plan can finish by 07:00 with different assignments but lose its one-hour buffer. The contribution may match even when operational slack differs. Do not reward activity for its own sake: an idle crew in the final conversion hour is consistent with the task's two-crew limit.</p></section><section class="card"><h2>Debrief questions and expected connections</h2><ol><li><strong>Which task controlled your finish?</strong> The load-out–floor–inspection dependency is the critical chain in efficient plans. Late reset work can become the actual last task in another plan.</li><li><strong>Why did the last available crew not always help?</strong> Total labor is only one constraint. Work cannot cross a dependency or a task's concurrency limit.</li><li><strong>What would you tell the booking manager?</strong> Protect conversion and inspection time before offering the calendar to another user. Do not promise a time based only on when the audience leaves.</li><li><strong>What did the contribution leave out?</strong> Annual fixed costs and broader tenant-delay effects. The $600 is explicitly additional overtime, not all real-world consequences.</li></ol><p>A useful report is: “We were ready at __; contribution was __; __ controlled our finish; next time we would __ because __.”</p></section><section class="card"><h2>Access, privacy, and fallback</h2><p>Every choice works with buttons and a keyboard; drag-and-drop is unnecessary. There is no running real-time timer. The clock advances only when a pod runs a turn. No personal information, login, internet data feed, or backend submission is required.</p><p>Progress and the last 12 completed runs save only in the current browser when storage is available. Downloadable text results include assignments, outcomes, and optional reflection. The instructor cannot pull class results from this game. A new pod should use <strong>New pod / reset</strong>.</p><p><strong>Paper fallback:</strong> draw three task columns and a row for each hour. Put three crew marks in each row, no more than two in any column. Block floor work until load-out reaches four marks. Reserve a full final inspection row.</p><p class="small" style="margin-top:15px">Alignment: the supplied Facility Management chapter and lecture concepts concerning booking calendars, arena conversion, qualified operating responsibilities, verified handover, and contribution. All work requirements, durations, costs, and Franklin Arena details are original classroom assumptions.</p></section></article>`;}
function render(focusId){$('main').innerHTML=guide?guidePage():!app.current?intro():['complete','stopped'].includes(app.current.phase)?results(app.current):active(app.current);bind();updateStorageStatus();if(focusId)requestAnimationFrame(()=>{const t=$(focusId);if(t&&!t.disabled)t.focus({preventScroll:true});else $('run-hour')?.focus({preventScroll:true});});}
function start(mode){const alias=$('team-alias');if(alias)app.alias=alias.value.trim().slice(0,60);app.current=E.create(mode);app.reflection={bottleneck:'',change:''};allocation={loadout:0,floor:0,reset:0};errorMessage='';savedNotice='';save();render();jumpTop();announce(modeName(mode)+' started at midnight. Assign three crews.');}
function finishIfNeeded(){if(['complete','stopped'].includes(app.current.phase)){app.history.push(JSON.parse(JSON.stringify(app.current)));app.history=app.history.slice(-12);}}
function changeAllocation(key,delta){const next={...allocation,[key]:allocation[key]+delta};const error=E.validateAllocation(app.current,next);if(error){announce(error);return;}allocation=next;errorMessage='';savedNotice='';render((delta>0?'more-':'less-')+key);announce(labels[key]+': '+allocation[key]+' crews. '+(3-E.KEYS.reduce((n,k)=>n+allocation[k],0))+' crews unassigned.');}
function advance(){try{const total=E.KEYS.reduce((n,k)=>n+allocation[k],0);if(total===0&&!window.confirm('All three crews are idle. Advance one full hour without completing any work?'))return;app.current=E.work(app.current,allocation);allocation={loadout:0,floor:0,reset:0};errorMessage='';savedNotice='';finishIfNeeded();save();render();if(app.current.phase==='stopped'){jumpTop();announce('Run ended at noon. The venue is unready.');}else if(app.current.phase==='inspection'){announce('All work is complete. One full inspection hour remains.');$('inspect')?.focus({preventScroll:true});}else{announce('Current time '+clock(app.current.hour)+'. Review the task progress and reassign crews.');$('assign-title')?.scrollIntoView({block:'nearest'});$('more-loadout')?.disabled?$('more-floor')?.focus({preventScroll:true}):$('more-loadout')?.focus({preventScroll:true});}}catch(err){errorMessage=err.message;render();announce(errorMessage);}}
function completeInspection(){try{app.current=E.inspect(app.current);finishIfNeeded();save();render();jumpTop();const out=E.outcome(app.current);announce((out.onTime?'On-time readiness. ':'Late readiness. ')+'Venue ready at '+clock(app.current.hour)+'. Contribution '+money(out.contribution)+'.');}catch(err){errorMessage=err.message;announce(errorMessage);}}
function textReport(){const lines=['ARENA TURNAROUND · MGT 340','Fictional classroom model','Pod alias: '+(app.alias||'Not provided'),'Created: '+new Date().toISOString(),'Browser-only practice. This file was not automatically submitted.',''];const states=app.history.length?app.history:app.current?[app.current]:[];states.forEach((state,i)=>{const o=E.outcome(state);lines.push('RUN '+(i+1)+' · '+modeName(state.mode),'Status: '+(o.onTime?'Ready on time':o.ready?'Ready late':state.phase==='stopped'?'Stopped unready':'In progress'),'Current time: '+clock(state.hour),'Protected handover: 07:00','Inspection complete: '+(state.inspectionComplete?'Yes':'No'),'Venue ready: '+(o.ready?clock(o.readyHour):'Not yet ready'),'Readiness buffer: '+duration(o.buffer),'Incremental overtime: '+o.overtimeHours+' × $600 = '+money(o.overtimeCost),'Contribution'+(o.ready?'':' estimate so far')+': $5,000 − '+money(o.overtimeCost)+' = '+money(o.contribution),'');state.log.forEach(item=>lines.push(clock(item.start)+'–'+clock(item.end)+': '+(item.kind==='inspection'?'Required inspection and sign-off':E.KEYS.map(k=>labels[k]+' '+item.allocation[k]).join('; '))));lines.push('');});if(app.current&&app.history.length&&!['complete','stopped'].includes(app.current.phase))lines.push('A new '+modeName(app.current.mode)+' is in progress at '+clock(app.current.hour)+'. Its full record will appear after completion.','');lines.push('LATEST RUN REFLECTION','What set the finish time? '+(app.reflection.bottleneck||'Not recorded'),'What would we change, and why? '+(app.reflection.change||'Not recorded'),'','MODEL NOTES','3 trained crews; each completes 1 crew-hour per hour; max 2 crews per task.','Load-out: 4 crew-hours. Floor: 6 standard / 8 stretch, after load-out. Guest reset: 4 crew-hours in parallel.','Required inspection: one full additional hour after all tasks finish.','Base $5,000 event contribution already includes scheduled work and required services through 07:00.','$600 per hour after 07:00 is additional overtime, deducted once. Contribution is not annual profit.','At noon, incomplete runs stop unready. Broader delay impacts are outside this model.');return lines.join('\n');}
function download(){const blob=new Blob([textReport()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='arena-turnaround-results.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('Results download created. Nothing was automatically submitted.');}
function bind(){if($('start-standard'))$('start-standard').onclick=()=>start('standard');document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>changeAllocation(b.dataset.task,Number(b.dataset.delta)));if($('run-hour'))$('run-hour').onclick=advance;if($('inspect'))$('inspect').onclick=completeInspection;if($('restart-round'))$('restart-round').onclick=()=>{if(window.confirm('Restart this run from midnight? Current assignments and progress will be cleared. Completed run history stays.'))start(app.current.mode);};if($('download'))$('download').onclick=download;if($('replay'))$('replay').onclick=()=>start(app.current.mode);if($('next-challenge'))$('next-challenge').onclick=()=>start('stretch');for(const key of ['bottleneck','change'])if($(key))$(key).oninput=ev=>{app.reflection[key]=ev.target.value.slice(0,800);save();};if($('print-guide'))$('print-guide').onclick=()=>window.print();}
$('reset-all').onclick=()=>{if(!window.confirm('Start a new pod? This clears the alias, current run, saved results, and reflection from this browser. Download any results you need first.'))return;app={version:1,alias:'',current:null,history:[],reflection:{bottleneck:'',change:''}};allocation={loadout:0,floor:0,reset:0};savedNotice='';errorMessage='';save();if(guide){location.href='./';return;}render();jumpTop();announce('New pod ready. Start a fresh rehearsal.');};
load();render();
})();
