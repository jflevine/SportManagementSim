<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Leak · Instructor Test Review</title><link rel="stylesheet" href="style.css"></head><body><header><p>PRIVATE TEST BUILD · NOT A GRADEBOOK</p><h1>Instructor review</h1></header><main><p id="mode"></p><form id="load"><label>Test server key (dev server only)<input id="key" type="password"></label><button>Load test handoffs</button></form><p id="status" role="status"></p><section id="runs"></section><h2>Review</h2><p>Compare the handoff with the decision record. Evaluate facts, uncertainty, proportionate protection, necessary disclosure and follow-up. No automated grade is assigned.</p><a href="index.html">Student workspace</a></main><script type="module">
import cf from './casefile.mjs';import{connect,localDriver}from'../../../simkit/client.mjs';import{reduce}from'../../../simkit/kernel.mjs';const dev=new URLSearchParams(location.search).has('dev');const sim=await connect({caseId:cf.id,casefile:cf,...(dev?{endpoint:'/simkit-api'}:{driver:localDriver(cf,{storeKey:'signal-leak.local.v1'})})});document.querySelector('a').href=dev?'index.html?dev':'index.html';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('mode').textContent=dev?'In-memory local test server. Use key dev. No live students.':'LOCAL ONLY: sees practice runs stored in this browser, not other students’ devices.';document.getElementById('load').onsubmit=async e=>{e.preventDefault();try{const r=await sim.instructor(document.getElementById('key').value,'DOXXING-TEST');document.getElementById('status').textContent=r.runs.length+' test runs found';document.getElementById('runs').innerHTML=r.runs.map(run=>{const s=reduce(cf,run.events);return `<article class="update"><h2>${esc(run.team)}</h2><p>${esc(run.runId)} · ${s.submitted?'Finalized':'In progress'}</p><p>${cf.signals(s).map(x=>esc(x.label)).join(' · ')}</p><pre>${esc(JSON.stringify(s.submitted?.memo||{},null,2))}</pre><details><summary>Decision record</summary><pre>${esc(JSON.stringify(run.events.filter(e=>e.type.startsWith('student.')),null,2))}</pre></details></article>`}).join('')}catch(err){document.getElementById('status').textContent=err.message}};
</script></body></html>
