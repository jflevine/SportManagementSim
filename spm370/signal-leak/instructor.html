<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Leak · Instructor Review</title><link rel="stylesheet" href="style.css"></head><body><header><p>PRIVATE RECORDS · NOT AN AUTOMATIC GRADEBOOK</p><h1>Instructor review</h1></header><main><p id="mode"></p><form id="load"><label>Instructor access key<input id="key" type="password"></label><button>Load handoffs</button></form><p id="status" role="status"></p><section id="runs"></section><h2>Review</h2><p>Compare the handoff with the decision record. Evaluate facts, uncertainty, proportionate protection, necessary disclosure and follow-up. No automated grade is assigned.</p><a href="index.html">Student workspace</a></main><script type="module">
import cf from './casefile.mjs';import{connect,localDriver}from'./engine/client.mjs';import{reduce}from'./engine/kernel.mjs';const q=new URLSearchParams(location.search),dev=q.has('dev'),practice=!dev;const sim=await connect({caseId:cf.id,casefile:cf,...(dev?{endpoint:'/simkit-api'}:practice?{driver:localDriver(cf,{storeKey:'signal-leak.local.v1'})}:{endpoint:'https://havsvkhddvdbzbsmhqbr.supabase.co/functions/v1/signal-leak'})});document.querySelector('a').href=dev?'index.html?dev':practice?'index.html?practice=1':'index.html';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('mode').textContent=dev?'In-memory local test server. Use key dev. No live students.':practice?'LOCAL ONLY: practice on this browser.':'Private course handoffs. Enter your existing simkit instructor key. Never share it with students.';document.getElementById('load').onsubmit=async e=>{e.preventDefault();try{const r=await sim.instructor(document.getElementById('key').value,q.has('qa')||dev||practice?'SIGNAL-QA':'SPM370-THURSDAY');document.getElementById('status').textContent=r.runs.length+' records found';document.getElementById('runs').innerHTML=r.runs.map(run=>{const s=reduce(cf,run.events);return `<article class="update"><h2>${esc(run.team)}</h2><p>${esc(run.runId)} · ${s.submitted?'Finalized':'In progress'}</p><p>${cf.signals(s).map(x=>esc(x.label)).join(' · ')}</p><pre>${esc(JSON.stringify(s.submitted?.memo||{},null,2))}</pre><details><summary>Decision record</summary><pre>${esc(JSON.stringify(run.events.filter(e=>e.type.startsWith('student.')),null,2))}</pre></details></article>`}).join('')}catch(err){document.getElementById('status').textContent=err.message}};
</script></body></html>
