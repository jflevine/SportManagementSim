econdary{background:white;border:1px solid #7c8793;color:var(--ink)}.btn.link{background:transparent;color:var(--accent);padding-left:0}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.fields label{display:block;font-weight:650;margin:16px 0 6px}.fields input,.fields textarea,.fields select{width:100%;padding:12px;border:1px solid #8d98a1;background:white;color:var(--ink);border-radius:6px}.fields textarea{min-height:125px;resize:vertical}.checkline{display:flex;align-items:flex-start;gap:12px;font-size:15px;margin:20px 0}.checkline input{flex:0 0 20px;width:20px;height:20px;margin-top:3px}.notice{background:#fff0d8;border-left:4px solid var(--accent);padding:15px 20px;margin:18px 0}.score{font:700 52px/1.1 Georgia,serif;margin:12px 0}.score small{font:400 20px system-ui}.tag{display:inline-block;border-radius:25px;padding:5px 12px;background:var(--pale);font-size:13px;font-weight:700}.source{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:34px;padding-top:20px}.source p{margin-bottom:8px}.flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;border-radius:8px;padding:12px 20px;z-index:10;max-width:92vw}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--pale)}.roster button{background:none;border:0;text-align:left;color:var(--accent);font-weight:700}.written{white-space:pre-wrap;overflow-wrap:anywhere}.receipt{word-break:break-word}.hidden,[hidden]{display:none!important}details{margin:15px 0}summary{cursor:pointer;font-weight:700}.outcome{animation:arrive .25s ease-out}@keyframes arrive{from{transform:translateY(6px);opacity:.3}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!im <body><a class="skip" href="#main">Skip to activity</a><header class="top"><div><div class="brand">OFF SCRIPT</div><small>SPM 370 · LEGAL DECISION LAB 2</small></div><a href="?guide=1" target="_blank" rel="noopener">Instructor guide <span class="small">(new tab)</span></a></header><main id="main" class="wrap"><h1>Nova's Next Deal</h1><p>Opening the activity…</p></main><div id="flash" class="flash" role="status" hidden></div><noscript>This activity requires JavaScript.</noscript>
<script>
(()=>{'use strict';
const API='https://havsvkhddvdbzbsmhqbr.supabase.co/functions/v1/spm370-offscript-nova';
const params=new URLSearchParams(location.search),DEMO=params.get('demo')==='1',GUIDE=params.get('guide')==='1',INSTRUCTOR=params.get('instructor')==='1';
const KEY='spm370.offscript.nova.v2'+(DEMO?'.demo':''),main=document.getElementById('main');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const QUESTIONS=[
 {title:'Can Seatline create the proposed AI voice under the original agreement?',options:['Yes. Paying $5,000 bought all future voice uses.','No. Clause 4 excludes AI training and new generated performances without a separate signed agreement.','Yes, as long as the new ads appear within the original 30 days.'],correct:1,feedback:'Clause 4 reserves AI uses. The existing recording permission is not permission to train a voice model or generate new speech. The proposed six-month term also exceeds Clause 2.'},
 {title:'Seatline says it owns the finished video file. What does that establish?',options:['It owns Nova’s identity and may make any new advertisement.','Nova must own the video because she appears in it.','Rights in the recording and permission to use Nova’s identity are separate questions.'],correct:2,feedback:'Keep copyright in creative work separate from identity permission. Ownership of a file or recording does not itself expand Nova’s contractual identity grant. Appearing in a work does not automatically establish copyright ownership.'},
 {title:'Which term most directly meets Nova’s requirement to control what her AI voice says?',options:['Nova must approve each final script and generated audio before release; no live generation or unapproved new lines.','The sponsor pays an additional fee for each unapproved advertisement.','Nova may object after the sponsor has published the advertisement.'],correct:0,feedback:'Prior approval of the actual script and output meets the stated client instruction. Extra money or a chance to complain afterward is not the same protection. A real agreement would also define the approval process.'},
 {title:'Seatline offers to label the ads “AI-generated.” What does that resolve?',options:['The label supplies Nova’s consent to all AI voice uses.','The label describes the production method; it does not replace Nova’s permission or a clear paid-endorsement disclosure.','The label makes every product claim truthful.'],correct:1,feedback:'Consent, disclosure of a paid relationship, and truthful claims are separate issues in the slides. An AI label does not authorize Nova’s identity use or make an unsupported claim accurate. We are not deciding a specific state-law disclosure claim.'},
 {title:'For a proposed 90-day AI license, which ending provision is the most specific?',options:['The sponsor may keep generating new ads as long as they sell only chairs.','The parties will “handle AI responsibly” when the campaign ends.','At day 90, stop the licensed uses and public ads; disable and delete the working voice model and specify treatment of stored outputs and backups. Any renewal requires a new written agreement.'],correct:2,feedback:'Meaningful consent addresses the use, time limit, and what happens to the model and outputs afterward. An actual contract should specify deletion, any tightly limited retention, responsible parties, and verification—not leave continued use implied.'}
];
const ROUTES={ai:{title:'Propose a limited AI campaign',money:8000,copy:'Three fixed chair advertisements, 90 days, Seatline’s own social accounts. Nova approves every script and final audio. No live voice bot, other products, or reuse beyond the agreement.',trade:'Additional income without another recording session; negotiating and checking generated speech still takes time.'},human:{title:'Offer two new recorded ads',money:6000,copy:'Nova records two new chair advertisements in one afternoon. Sixty days on Seatline’s own social accounts. Nova approves the finished videos. No AI training or generated voice.',trade:'Less income than the AI proposal and an afternoon of Nova’s time; the sponsor receives actual approved performances.'},decline:{title:'Keep the original deal only',money:0,copy:'Finish the existing one-video, 30-day agreement. No new campaign or voice-model permission.',trade:'No extra income from this offer; Nova keeps her time and avoids the proposed expanded uses.'}};
const FINAL={ai:{title:'Hold to the limited AI terms',result:'A smaller deal, with defined control.',detail:'Seatline accepts the three-ad, 90-day proposal for an additional $8,000. Nova approves it and signs a separate agreement requiring approval of each script and final audio, no live generation, and defined deletion/end-of-use terms. Only those specified uses are authorized.',money:8000},human:{title:'Offer the non-AI alternative',result:'A new performance, not a voice model.',detail:'Seatline accepts two newly recorded ads for an additional $6,000 and 60 days of use. Nova approves the agreement and reserves an afternoon to record. The new agreement requires her approval of the finished ads and gives no AI rights.',money:6000},decline:{title:'Decline the expansion',result:'The original promise stands.',detail:'Seatline accepts that there will be no expanded campaign. Nova completes the original agreement and keeps the $5,000 already earned. There is no additional payment or new identity permission.',money:0},accept:{title:'Tell Seatline yes to the unrestricted offer',result:'Nova stops the signature.',detail:'Nova refuses to sign: the sponsor’s ability to generate unreviewed lines conflicts with her express instruction. Your recommendation has not created permission or earned another payment. Reconsider the offer or explain why your advice failed to serve the client.',money:0}};
const dollars=n=>'$'+n.toLocaleString('en-US');
function fresh(){return {version:'2.0.0',stage:0,answers:Array(5).fill(null),first:Array(5).fill(null),checked:Array(5).fill(false),route:'',final:'',reflections:['',''],firstName:'',lastName:'',email:'',consent:false,attemptId:'',pending:null,receipt:null};}
let s=fresh(),storageOK=true,busy=false,rows=[],access='',selected=null,gradeDirty=false,gradeBusy=false;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.version==='2.0.0'&&Array.isArray(old.answers)&&old.answers.length===5){s={...s,...old};for(const a of ['answers','first'])s[a]=Array.from({length:5},(_,i)=>[0,1,2].includes(old[a]?.[i])?old[a][i]:null);s.checked=Array.from({length:5},(_,i)=>!!old.checked?.[i]);s.reflections=Array.from({length:2},(_,i)=>String(old.reflections?.[i]||'').slice(0,1600));s.stage=Number.isInteger(old.stage)&&old.stage>=0&&old.stage<=4?old.stage:0;if(!ROUTES[s.route])s.route='';if(!FINAL[s.final])s.final='';}}catch{storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch{storageOK=false;}}
function flash(t){const e=document.getElementById('flash');e.textContent=t;e.hidden=false;clearTimeout(flash.timer);flash.timer=setTimeout(()=>e.hidden=true,4500);}
function total(a=s.answers){return QUESTIONS.reduce((v,q,i)=>v+(a?.[i]===q.correct?2:0),0);}
function gate(ids){return ids.every(i=>s.answers[i]!==null&&s.checked[i]);}
function source(){return '<footer class="source"><p>Adapted from Jeffrey Levine’s supplied Chapter 5: <em>Player Image Rights and Branding</em> lecture slides and notes: “Owning Your Identity,” “Practical Mechanics,” “The Sample NIL Clause,” “Endorsement Disclosure,” “Stakeholders and Bargaining Power,” and “Meaningful Consent for AI Uses.”</p><p>All parties, amounts, offers, contract terms, deadlines, and responses in this exercise are fictional. Use the supplied terms to advise the client; do not assume a nationwide NIL rule, union/NCAA coverage, or a court outcome. Build 2.0.1.</p></footer>';}
function banner(){return (DEMO?'<div class="notice">Instructor demo · separate browser save · no student submission will be sent. <button class="btn link" data-act="reset-demo">Restart demo</button></div>':'')+(!storageOK?'<div class="notice">Browser saving is unavailable. Keep this tab open and save your summary before leaving. <button class="btn link" data-act="download">Save a backup now</button></div>':'');}
function progress(){return '<ol class="steps" aria-label="Case progress">'+['Read the contract','Negotiate the request','Make the final call'].map((t,i)=>'<li class="'+(s.stage===i+1?'active':s.stage>i+1?'done':'')+'">'+(i+1)+'. '+t+'</li>').join('')+'</ol>';}
function client(){return '<aside class="client"><div class="eyebrow">Your client · Nova</div><p>“I’m open to more paid work. But nothing that sounds like me goes out unless I approve the exact words and final audio first.”</p><p class="small">You represent Nova—not the sponsor. You can negotiate and recommend; Nova must authorize any new agreement.</p></aside>';}
function contract(full=true){return '<section class="panel contract"><div class="eyebrow">Signed agreement · teaching extract</div><h2>The original deal</h2>'+ (full?'<div class="clause"><h3>1 · One approved use</h3><p>Nova earns $5,000 for one approved, 30-second Seatline gaming-chair video. Seatline may post that video on its own social accounts. No other product, advertisement, or personal channel is included.</p></div><div class="clause"><h3>2 · Time and approval</h3><p>Permission lasts 30 days from first posting. Nova approves the final video. No altered performance or new dialogue is authorized. Seatline must remove its public campaign posts when permission ends.</p></div><div class="clause"><h3>3 · Separate rights</h3><p>For this exercise, Seatline already has the necessary copyright permissions for the recording and proposed production. Those permissions do not transfer Nova’s identity rights or expand this agreement’s limits on her identity use.</p></div>':'<p><strong>$5,000 already earned.</strong> One approved video; Seatline’s own social accounts; 30 days from first posting. No other ads or new dialogue.</p>')+'<div class="clause"><h3>4 · AI and expanded uses</h3><p>No AI training, voice model, or generated Nova performance is authorized. Any expanded use requires a separate agreement signed by Nova, specifying uses, payment, duration, approvals, and treatment of the model and outputs when permission ends.</p></div></section>';}
function question(i){const q=QUESTIONS[i];return '<fieldset class="question"><legend>Concept check '+(i+1)+' of 5 · '+esc(q.title)+'</legend><div class="choices">'+q.options.map((t,j)=>'<label class="option"><input type="radio" name="q'+i+'" data-q="'+i+'" value="'+j+'" '+(s.answers[i]===j?'checked':'')+'><span>'+esc(t)+'</span></label>').join('')+'</div>'+(s.checked[i]?'<div class="feedback '+(s.answers[i]===q.correct?'':'wrong')+'" role="status"><strong>'+(s.answers[i]===q.correct?'2/2 · Correct.':'0/2 · Review and retry.')+'</strong> '+esc(q.feedback)+'</div>':'')+'</fieldset>';}
function verify(ids){return '<button class="btn secondary" data-act="check" data-ids="'+ids.join(',')+'">Check '+(ids.length===1?'this answer':'these answers')+'</button><p class="small muted">Read feedback and retry without penalty. First answers are retained for instructor review; the automatic score uses your final answers.</p>';}
function option(group,id,title,copy,trade){return '<label class="option"><input type="radio" name="'+group+'" data-field="'+group+'" value="'+id+'" '+(s[group]===id?'checked':'')+'><span><strong>'+esc(title)+'</strong>'+esc(copy)+(trade?'<small>'+esc(trade)+'</small>':'')+'</span></label>';}
function welcome(){return '<div class="hero"><section><div class="eyebrow">One creator. One sponsor. One contract.</div><h1>Nova’s Next Deal</h1><p class="lead">You represent <strong>Nova, an adult gaming content creator</strong>. Her chair sponsor wants an AI version of her voice. Your job is to protect her choices and negotiate a deal she can actually approve.</p><p>There is no event to organize and no team to manage. Everything you need is in the case and the contract.</p><button class="btn" data-act="start">Open Nova’s contract →</button></section><aside class="portrait"><img src="assets/avatars/nova.webp" alt="Illustration of Nova, your fictional client" onerror="this.hidden=true"><div class="eyebrow">You work for her</div><h2>Meet Nova</h2><p>Gaming videos. A recognizable voice. An audience that trusts her.</p><p class="small">Her priority: earn income without surrendering control of what her voice says.</p></aside></div><div class="panel"><h2>What you will do</h2><p><strong>1. Read</strong> four short contract clauses. <strong>2. Negotiate</strong> a sponsor request. <strong>3. Decide</strong> what to recommend when the sponsor pushes back.</p><p>Complete five concept checks and two short explanations, then submit under your own name and school email. Pair discussion is welcome; each student submits individually.</p><p class="small"><strong>Scoring:</strong> five concept checks × 2 points = 10 automatic points. Feedback and retries are allowed. Negotiation choices do not carry hidden point penalties. Your instructor reviews the written reasoning and may adjust the recorded grade. Money is a contract term, not your grade.</p></div><details><summary>Already started the previous CROSSPLAY version?</summary><p>This is a separate, simplified activity. Your previous browser save and submissions have not been converted or erased. <a href="legacy.html">Resume the previous version</a> only when your instructor directs you to.</p></details>';}
function read(){return progress()+'<div class="eyebrow">Step 1 · What did Nova actually authorize?</div><h1>Read the deal before you answer.</h1><div class="task"><p><strong>Your task:</strong> read the contract and answer the two checks below. Then select “Check these answers.” Treat the supplied agreement as valid. You are identifying what it permits—not deciding a lawsuit or testing contract-formation rules.</p></div><div class="case-grid"><section><div class="request"><div class="eyebrow">Seatline · the gaming-chair sponsor</div><p>“We paid for your original video. Can we use it to create an AI Nova voice and generate new chair ads for six months? We can offer another $12,000.”</p></div><p>The $5,000 for the original video is already earned and stays with Nova whichever new option she chooses. No voice model has been created and no expanded agreement has been signed.</p>'+question(0)+question(1)+verify([0,1])+'<div class="actions"><button class="btn" data-act="next" '+(!gate([0,1])?'disabled':'')+'>Next: negotiate the request →</button></div></section><aside>'+contract()+client()+'</aside></div>';}
function negotiate(){return progress()+'<div class="eyebrow">Step 2 · Choose an opening proposal</div><h1>More money. Which rights?</h1><div class="task"><p><strong>Your task:</strong> choose one proposal to send to Seatline. All three can be defended. Then answer the two concept checks. This is a negotiation proposal, not a signed deal.</p></div><div class="case-grid"><section><div class="request"><p><strong>The sponsor wants:</strong> new AI-voiced chair ads for six months, without asking Nova to approve every new line. Its offer is <strong>an additional $12,000</strong>.</p><p>Nova will consider AI, but she will not accept unreviewed words being put in her voice.</p></div><h2>Your opening proposal</h2><div class="choices">'+Object.entries(ROUTES).map(([id,r])=>option('route',id,r.title+' · +'+dollars(r.money),r.copy,r.trade)).join('')+'</div>'+question(2)+question(3)+verify([2,3])+'<div class="actions"><button class="btn secondary" data-act="back">Back</button><button class="btn" data-act="next" '+(!s.route||!gate([2,3])?'disabled':'')+'>Send proposal; see the counteroffer →</button></div></section><aside>'+client()+contract(false)+'<section class="panel"><h3>What would a new AI agreement cover?</h3><p class="small">Specific training and output uses; script and audio approval; payment; duration; no unapproved live generation; and what happens to the model, ads, stored outputs, and backups when permission ends.</p></section></aside></div>';}
function decide(){return progress()+'<div class="eyebrow">Step 3 · One final counteroffer</div><h1>The sponsor pushes back.</h1><div class="task"><p><strong>Your task:</strong> choose your final recommendation, answer the last concept check, and explain your reasoning. You may change your earlier proposal. Your client’s instructions remain the same. Answer the final AI-license check even if you recommend a non-AI option.</p></div><p class="tag">You proposed: '+esc(ROUTES[s.route]?.title||'No proposal yet')+'</p><div class="case-grid"><section><div class="request"><div class="eyebrow">Seatline’s reply · hypothetical deadline: tonight</div><p>“Our first choice is still <strong>$12,000 for six months</strong>. We need to generate new chair ads without waiting for Nova to review each one. We’ll label them ‘AI-generated.’ Can you tell us yes tonight?”</p><p class="small">The deadline is a case fact, not a real countdown. The $8,000 limited-AI and $6,000 recorded-ad alternatives remain available if you hold to those terms. Nova may also decline the expansion without losing the original $5,000.</p></div><h2>What do you recommend?</h2><div class="choices">'+option('final','ai',FINAL.ai.title+' · +$8,000','Three fixed ads, 90 days, prior script/audio approval, no live generation, and explicit model/output ending terms.','Ask Nova to approve and sign the specific new agreement.')+option('final','human',FINAL.human.title+' · +$6,000','Two actually recorded ads, 60 days, final-video approval, no AI.','Nova trades an afternoon of work for additional income.')+option('final','decline',FINAL.decline.title+' · +$0','Complete the original deal only. No additional rights or work.','Nova forgoes additional income and retains flexibility.')+option('final','accept',FINAL.accept.title+' · proposed +$12,000','Recommend six months of new AI ads without Nova’s prior review of every output.','This asks Nova to abandon her stated approval requirement; you cannot authorize it for her.')+'</div>'+(s.final?'<section class="panel outcome"><div class="eyebrow">What happens under these fictional facts</div><h2>'+esc(FINAL[s.final].result)+'</h2><p>'+esc(FINAL[s.final].detail)+'</p><p class="small">This is a scenario response, not a court ruling or a point award. You may revise your recommendation before submitting.</p></section>':'')+question(4)+verify([4])+'</section><aside>'+client()+contract(false)+'</aside></div><section class="panel fields"><h2>Your advice to Nova</h2><p>Write <strong>2–3 sentences for each prompt</strong>. Name an actual clause or term. You do not need case names, legal citations, or outside research.</p><label for="r0">1. What should Nova do, and why does the original agreement not already authorize the sponsor’s expanded request?</label><textarea id="r0" data-ref="0" maxlength="1600" placeholder="I recommend … . Clause … permits / excludes …, so … .">'+esc(s.reflections[0])+'</textarea><label for="r1">2. State one precise term you would require and one real cost of your recommendation to Nova or Seatline.</label><textarea id="r1" data-ref="1" maxlength="1600" placeholder="I would require … . The tradeoff is … . If declining, explain which boundary matters and what income or opportunity Nova gives up.">'+esc(s.reflections[1])+'</textarea><p class="small muted">Both responses are required (at least 30 characters each). Length only checks completeness; it does not grade the quality of your reasoning.</p><div class="actions"><button class="btn secondary" data-act="back">Back</button><button class="btn" data-act="review" '+(!s.final||!gate([4])?'disabled':'')+'>Review & submit →</button></div></section>';}
function record(){return {version:'2.0.0',attemptId:s.attemptId,firstName:s.firstName.trim(),lastName:s.lastName.trim(),email:s.email.trim().toLowerCase(),answers:[...s.answers],firstAnswers:[...s.first],proposal:s.route,recommendation:s.final,reflections:s.reflections.map(t=>t.trim()),consent:s.consent};}
function summary(){const r=s.pending||s.receipt?.submitted||record();return 'OFF SCRIPT — NOVA’S NEXT DEAL\nSPM 370 · Legal Decision Lab 2 · v2.0.0\n'+(DEMO?'INSTRUCTOR DEMO — NOT SUBMITTED\n':'')+'Student: '+r.firstName+' '+r.lastName+'\nEmail: '+r.email+'\nConcept score: '+(s.receipt?.score??total(r.answers))+'/10'+(s.receipt?' (server confirmed)':' (local estimate; not submitted)')+'\nFirst-check score: '+total(r.firstAnswers)+'/10 (diagnostic only)\nProposal: '+ROUTES[r.proposal]?.title+'\nFinal recommendation: '+FINAL[r.recommendation]?.title+'\n\nAdvice: '+r.reflections[0]+'\n\nTerm and tradeoff: '+r.reflections[1]+'\n\n'+QUESTIONS.map((q,i)=>'Check '+(i+1)+': '+q.title+'\nAnswer: '+q.options[r.answers[i]]).join('\n\n')+'\n\n'+(s.receipt?'Receipt: '+s.receipt.receipt+'\nSubmitted: '+s.receipt.submittedAt:'No confirmed online receipt. Save this copy and submit it in Canvas if your instructor directs you to use the fallback.')+'\nNegotiation choices and money do not set the automatic score. Written reasoning requires instructor review. Nothing is sent to Canvas automatically.\n';}
function review(){const locked=!!s.pending||!!s.receipt;return '<div class="eyebrow">'+(s.receipt?'Private submission confirmed':'Finish your individual submission')+'</div><h1>'+(s.receipt?'Your advice is on record.':'Review your advice.')+'</h1><div class="two"><section class="panel"><h2>Automatic concept score</h2><div class="score">'+(s.receipt?.score??total())+' <small>/ 10</small></div><p>Five checks, two points each. Final checked answers determine this score. Your instructor can review your reasoning and adjust the grade.</p><p class="small">First-check score: '+total(s.first)+'/10, retained only to help your instructor see what needed review.</p></section><section class="panel"><h2>'+esc(FINAL[s.final]?.title)+'</h2><p>'+esc(FINAL[s.final]?.detail)+'</p></section></div><section class="panel"><h2>Your written advice</h2><p class="written">'+esc(s.reflections[0])+'</p><h3>Your proposed term and tradeoff</h3><p class="written">'+esc(s.reflections[1])+'</p></section>'+(s.receipt?'<section class="panel receipt"><h2>Submission received</h2><p>'+esc(s.firstName)+' '+esc(s.lastName)+' · '+esc(s.email)+'</p><p><strong>Receipt:</strong> '+esc(s.receipt.receipt)+'<br><strong>Submitted:</strong> '+esc(s.receipt.submittedAt)+'</p><p>Keep the summary for your records. This saved the lab to your instructor’s course database, not Canvas.</p></section>':DEMO?'<div class="notice">Demo mode: you can review and save a summary, but this attempt cannot submit a student record.</div>':'<form id="submit" class="panel fields"><h2>Your name and school email</h2><fieldset '+(locked?'disabled':'')+' style="border:0;padding:0"><div class="two"><div><label for="fn">First name</label><input id="fn" data-name="firstName" autocomplete="given-name" maxlength="60" required value="'+esc(s.firstName)+'"></div><div><label for="ln">Last name</label><input id="ln" data-name="lastName" autocomplete="family-name" maxlength="60" required value="'+esc(s.lastName)+'"></div></div><label for="email">School email</label><input id="email" data-name="email" type="email" autocomplete="email" maxlength="120" required value="'+esc(s.email)+'"><label class="checkline"><input id="consent" type="checkbox" '+(s.consent?'checked':'')+' required><span>This is my own information and writing. Send my identity, choices, answers, scores, and advice to my instructor’s private course database. This does not submit a Canvas assignment.</span></label></fieldset><button class="btn" '+(busy?'disabled':'')+'>'+(busy?'Confirming submission…':s.pending?'Retry the same saved submission':'Submit Decision Lab 2')+'</button><p class="small muted">'+(s.pending?'This exact attempt is saved for retry. Editing is paused so an uncertain connection cannot create a different attempt.':'You must receive a confirmation receipt before assuming your work was saved. Names and email are self-reported, not authenticated.')+'</p><p id="error" class="notice" '+(!s.error?'hidden':'')+'>'+esc(s.error||'')+'</p></form>')+'<div class="actions">'+(!locked?'<button class="btn secondary" data-act="edit">Edit my work</button>':'')+'<button class="btn secondary" data-act="download">Save summary</button><button class="btn secondary" data-act="print">Print</button>'+(s.receipt?'<button class="btn link" data-act="new">Another student / new attempt</button>':'')+'</div>';}
function guide(){return '<div class="eyebrow">Instructor guide · Simplified edition 2.0.1</div><h1>One contract, not a whole fictional world.</h1><p class="lead">Students represent Nova, an adult gaming content creator. One sponsor seeks an expanded AI voice license. The central question stays constant: what is authorized, and what new terms serve this client?</p><div class="actions"><a class="btn" href="?demo=1">Play instructor demo</a><a class="btn secondary" href="./">Student activity</a><a class="btn secondary" href="?instructor=1">New instructor gradebook</a></div><section class="panel"><h2>Read aloud</h2><p>“You represent Nova, not the brand. A sponsor paid her for one recorded video. Now it wants new ads in an AI version of her voice. Read the original contract, propose a response, and defend your final advice. Nova is open to more income but insists on approving the exact words and audio. The facts, contract, and task stay visible; you do not need to invent an event or research a statute.”</p></section><section class="panel"><h2>What the slides contribute</h2><p><strong>Owning Your Identity / slide 4:</strong> rights in the recording and identity permission are distinct.</p><p><strong>Practical Mechanics and Sample NIL Clause / slides 15–16 and the full reference clause:</strong> scope, approval, duration, separate AI consent, and end-of-use terms.</p><p><strong>Endorsement Disclosure / slide 18:</strong> AI labeling, consent, clear paid-relationship disclosure, and truthful claims are not interchangeable.</p><p><strong>Stakeholders / slide 21 and Meaningful Consent / slide 25:</strong> control and compensation are negotiated; permission addresses training, generated performances, approvals, and the model and outputs afterward.</p><p class="small">The proposed amounts and sponsor/client responses are fictional teaching design, not facts in the lecture. No case holding, current bill status, universal AI prohibition, or union/NCAA coverage is added to the decision rule.</p></section><section class="panel"><h2>Facilitation and grading</h2><p>Planning target: 15–20 minutes plus debrief; adjust after the first student run. Three case steps are followed by a review/submission screen. Students may discuss in pairs, but each completes the checks and submits separate writing.</p><p><strong>New scoring:</strong> five objective concept checks × 2 = 10 automatic points. This replaces the older version’s completion-points formula. Feedback and retries are allowed; first answers remain diagnostic. Strategic choices do not have hidden point values. Written explanations are not machine-graded for quality. Review and override the automatic score when warranted.</p><p>The AI-limited, recorded-performance, and no-expansion routes can each be defended. The unrestricted route conflicts with Nova’s express instruction; Nova refuses to sign. A strong response identifies that conflict rather than treating an agent’s recommendation as the client’s consent.</p><p>The two written prompts ask for a recommendation linked to the original permission, a concrete term, and a meaningful tradeoff. Assess reasoning, not how much money the student selected. Use issue spotting, legal application, stakeholder interests, and a supported recommendation when reviewing.</p></section><section class="panel"><h2>Debrief</h2><p>Which clause controlled the new request? What did the larger payment fail to supply? Why might two advisers reasonably recommend different authorized deals? Read one precise approval or end-of-use term aloud.</p><p>Keep the distinction from the slides: not authorized by this contract does not automatically establish a particular statutory violation or a court remedy.</p></section><section class="panel"><h2>Existing work</h2><p>Previous campaign files, browser storage, backend, and instructor records are preserved separately. <a href="legacy.html">Previous student activity</a> · <a href="instructor/legacy.html">Previous gradebook</a>.</p><p>New submissions go to the new Nova gradebook using the existing course instructor key. Scores do not sync to Canvas; export or enter them separately. An unconfirmed local summary is not proof of a database save.</p></section>'+source();}
function render(scroll=false){if(GUIDE){main.innerHTML=guide();return;}if(INSTRUCTOR){instructor();return;}main.innerHTML=banner()+[welcome,read,negotiate,decide,review][s.stage]()+source();if(scroll){window.scrollTo(0,0);const h=main.querySelector('h1');h?.setAttribute('tabindex','-1');h?.focus({preventScroll:true});}}
function download(text,name){const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
// AbortController supports browsers that lack AbortSignal.timeout. Keep the
// timeout active while reading JSON, not just until response headers arrive.
async function apiRequest(url,options={}){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);
  try{
    const response=await fetch(url,{...options,signal:controller.signal});
    let data;
    try{data=await response.json();}catch(error){
      if(controller.signal.aborted)throw error;
      throw Error('The server response could not be confirmed. Keep your work and retry.');
    }
    return {response,data};
  }finally{clearTimeout(timer);}
}
async function submit(){
  if(DEMO||busy||s.receipt)return;
  if(!s.pending){
    if(!s.firstName.trim()||!s.lastName.trim()||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email.trim())||!s.consent||!gate([0,1,2,3,4])||!ROUTES[s.route]||!FINAL[s.final]||s.reflections.some(t=>t.trim().length<30)){
      flash('Complete your name, email, five checked answers, choices, and both explanations.');return;
    }
    s.attemptId=s.attemptId||crypto.randomUUID();s.pending=record();save();
  }
  busy=true;s.error='';render();
  try{
    const {response:r,data:d}=await apiRequest(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s.pending)});
    if(!r.ok){
      // These statuses are definite pre-insert validation failures in this API.
      // Let the student correct the rejected input; preserve all of their work.
      // Keep 409, 429, 5xx, timeouts and uncertain responses frozen for safe retry.
      if([400,413,415].includes(r.status)){s.pending=null;s.attemptId='';}
      throw Error(d?.error||'Submission was not confirmed.');
    }
    if(!d?.ok||typeof d.receipt!=='string'||!d.receipt||!Number.isInteger(d.score)||d.score<0||d.score>10||typeof d.submittedAt!=='string'||!Number.isFinite(Date.parse(d.submittedAt)))throw Error('The server did not return a valid receipt.');
    s.receipt={...d,submitted:clone(s.pending)};s.pending=null;s.error='';
  }catch(e){s.error=['AbortError','TimeoutError'].includes(e.name)?'No save was confirmed before the connection timed out. Retry the same saved submission.':e.message;}
  finally{busy=false;save();render();}
}
function instructor(){if(!access){main.innerHTML='<div class="eyebrow">Instructor only · Nova edition</div><h1>Review your creators’ advice.</h1><form id="login" class="panel fields"><label for="access">Existing SPM 370 instructor access key</label><input type="password" id="access" autocomplete="current-password" required maxlength="200"><div class="actions"><button class="btn">Open gradebook</button><a href="instructor/legacy.html">Previous version records</a></div><p id="login-error" class="notice" hidden></p></form>';return;}const r=rows.find(x=>x.id===selected);main.innerHTML='<div class="eyebrow">Instructor gradebook · '+rows.length+' submissions loaded</div><h1>Nova’s Next Deal</h1><div class="actions"><button class="btn secondary" data-act="refresh">Refresh</button><button class="btn secondary" data-act="csv">Export grades CSV</button><button class="btn secondary" data-act="lock">Lock gradebook</button><a href="instructor/legacy.html">Previous version</a></div><div class="panel fields"><label for="search">Find a student</label><input id="search" placeholder="Name or email"></div><div class="table-scroll panel"><table class="roster"><thead><tr><th>Student</th><th>Automatic</th><th>Recorded</th><th>Review</th></tr></thead><tbody id="roster">'+roster(rows)+'</tbody></table></div>'+(r?'<section class="panel fields" id="student"><h2>'+esc(r.first_name+' '+r.last_name)+'</h2><p>'+esc(r.email)+' · '+esc(r.submitted_at)+'</p><p><strong>First-check:</strong> '+r.first_score+'/10 · <strong>Automatic:</strong> '+r.score+'/10</p><p><strong>Opening proposal:</strong> '+esc(ROUTES[r.work.proposal]?.title)+'<br><strong>Final recommendation:</strong> '+esc(FINAL[r.work.recommendation]?.title)+'</p><h3>Recommendation and contract analysis</h3><p class="written">'+esc(r.work.reflections[0])+'</p><h3>Term and tradeoff</h3><p class="written">'+esc(r.work.reflections[1])+'</p><details><summary>Review concept-check answers</summary>'+QUESTIONS.map((q,i)=>'<p><strong>'+(i+1)+'. '+esc(q.title)+'</strong><br>Final: '+esc(q.options[r.work.answers[i]])+'<br>First: '+esc(q.options[r.work.firstAnswers[i]])+'</p>').join('')+'</details><form id="grade"><label for="grade-number">Recorded grade /10 (automatic score remains preserved)</label><input id="grade-number" type="number" min="0" max="10" step="0.5" required value="'+(r.grade_override??r.score)+'"><label for="grade-notes">Feedback / grading rationale</label><textarea id="grade-notes" maxlength="5000">'+esc(r.grader_notes||'')+'</textarea><div class="actions"><button class="btn">Save reviewed grade</button></div><p id="grade-error" class="notice" hidden></p></form></section>':'<p>Select a student to review their advice.</p>');}
function roster(rr){return rr.map(r=>'<tr><td><button data-student="'+esc(r.id)+'">'+esc(r.last_name+', '+r.first_name)+'</button></td><td>'+r.score+'/10</td><td>'+(r.grade_override??r.score)+'/10</td><td>'+(r.graded_at?'Reviewed':'Not reviewed')+'</td></tr>').join('');}
async function loadRows(key){
  const {response:r,data:d}=await apiRequest(API+'/instructor',{headers:{'x-instructor-key':key}});
  if(!r.ok||!d?.ok)throw Error(d?.error||'The gradebook could not be loaded.');
  if(!Array.isArray(d.submissions))throw Error('Unexpected gradebook response.');
  rows=d.submissions;access=key;gradeDirty=false;instructor();
  if(d.truncated)flash('Only the first 2,000 submissions were returned.');
}
function csvCell(v){let t=String(v??'');if(/^[\s]*[=+\-@]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"';}
main.addEventListener('input',e=>{if(INSTRUCTOR&&['grade-number','grade-notes'].includes(e.target.id)){gradeDirty=true;return;}if(e.target.id==='search'){const q=e.target.value.toLowerCase();document.getElementById('roster').innerHTML=roster(rows.filter(r=>(r.first_name+' '+r.last_name+' '+r.email).toLowerCase().includes(q)));return;}if(s.pending||s.receipt)return;if(e.target.dataset.ref!==undefined)s.reflections[Number(e.target.dataset.ref)]=e.target.value;else if(e.target.dataset.name)s[e.target.dataset.name]=e.target.value;else return;save();});
main.addEventListener('change',e=>{if(s.pending||s.receipt)return;const q=e.target.dataset.q,f=e.target.dataset.field;if(e.target.id==='consent'){s.consent=e.target.checked;save();return;}if(q!==undefined){s.answers[Number(q)]=Number(e.target.value);s.checked[Number(q)]=false;}else if(f==='route'||f==='final')s[f]=e.target.value;else return;save();const name=e.target.name,value=e.target.value;render();main.querySelector('input[name="'+name+'"][value="'+value+'"]')?.focus({preventScroll:true});});
main.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(INSTRUCTOR&&gradeBusy){flash('Wait for the grade save to finish.');return;}
  if(b.dataset.student){
    if(gradeDirty&&!confirm('You have unsaved grade or feedback changes. Discard them and open another student?'))return;
    gradeDirty=false;selected=b.dataset.student;instructor();document.getElementById('student')?.scrollIntoView({block:'start'});return;
  }
  const a=b.dataset.act;if(!a)return;
  if(INSTRUCTOR){
    if(['refresh','lock'].includes(a)&&gradeDirty&&!confirm('Discard your unsaved grade or feedback changes?'))return;
    try{
      if(a==='refresh')await loadRows(access);
      if(a==='lock'){access='';rows=[];selected=null;gradeDirty=false;instructor();}
      if(a==='csv'){
        const lines=[['Last name','First name','Email','Automatic /10','Recorded /10','First-check /10','Reviewed at','Feedback'],...rows.map(r=>[r.last_name,r.first_name,r.email,r.score,r.grade_override??r.score,r.first_score,r.graded_at||'',r.grader_notes||''])];
        download(lines.map(row=>row.map(csvCell).join(',')).join('\r\n'),'SPM370_Decision_Lab_2_Nova_Grades.csv');
      }
    }catch(err){flash(err.message);}return;
  }
  if(a==='download'){download(summary(),'Off_Script_Nova_Summary.txt');return;}
  if(a==='print'){window.print();return;}
  if(a==='reset-demo'&&DEMO){if(confirm('Restart this demo? Student work is separate and will not be changed.')){s=fresh();save();render(true);}return;}
  if(a==='new'&&s.receipt){if(!confirm('Save your receipt first. Start a separate individual attempt? The server record will not be changed.'))return;s=fresh();save();render(true);return;}
  if(s.pending||s.receipt)return;
  if(a==='check'){
    const ids=b.dataset.ids.split(',').map(Number);
    if(ids.some(i=>s.answers[i]===null)){flash('Select one answer for each check first.');return;}
    for(const i of ids){if(s.first[i]===null)s.first[i]=s.answers[i];s.checked[i]=true;}
    save();render();main.querySelector('.feedback')?.scrollIntoView({block:'center'});return;
  }
  if(a==='start')s.stage=1;
  if(a==='back')s.stage=Math.max(1,s.stage-1);
  if(a==='next'){if(s.stage===1&&!gate([0,1]))return;if(s.stage===2&&(!s.route||!gate([2,3])))return;s.stage++;}
  if(a==='review'){
    if(!s.final||!gate([0,1,2,3,4])||s.reflections.some(t=>t.trim().length<30)){flash('Check all five answers and write both explanations before reviewing. Use at least 30 characters in each.');return;}
    s.stage=4;
  }
  if(a==='edit')s.stage=3;
  save();render(true);
});
main.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='submit'){await submit();return;}
  if(e.target.id==='login'){
    const key=document.getElementById('access').value.trim(),b=e.target.querySelector('button');b.disabled=true;
    try{await loadRows(key);}catch(err){access='';const p=document.getElementById('login-error');p.textContent=err.message;p.hidden=false;b.disabled=false;}return;
  }
  if(e.target.id==='grade'){
    if(gradeBusy)return;
    const form=e.target,id=selected,grade=Number(document.getElementById('grade-number').value),notes=document.getElementById('grade-notes').value;
    const controls=[...form.querySelectorAll('input,textarea,button')];controls.forEach(el=>el.disabled=true);gradeBusy=true;
    try{
      const {response:r,data:d}=await apiRequest(API+'/instructor',{method:'POST',headers:{'Content-Type':'application/json','x-instructor-key':access},body:JSON.stringify({id,grade,notes})});
      if(!r.ok||!d?.ok)throw Error(d?.error||'Grade was not saved.');
      gradeDirty=false;await loadRows(access);flash('Reviewed grade saved.');
    }catch(err){const p=document.getElementById('grade-error');if(p){p.textContent=err.message;p.hidden=false;}controls.forEach(el=>el.disabled=false);}
    finally{gradeBusy=false;}
  }
});
